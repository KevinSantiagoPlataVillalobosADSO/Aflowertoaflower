<!DOCTYPE html>
<html lang="es-CO">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Parcera</title>
<style>
  /* ═════════════════════════════════════════════
     TOKENS
     ═════════════════════════════════════════════ */
  :root{
    --fondo-1:#1e0b14;
    --fondo-2:#120709;
    --fondo-3:#060305;

    --carta-1:#2a1019;
    --carta-2:#1a0a11;

    --vino:#5b0f2a;
    --vino-2:#8e1b3f;
    --rosa:#e58ba4;
    --rosa-2:#f6c3cf;

    --texto:#fbf4f5;
    --medio:rgba(251,244,245,.56);
    --tenue:rgba(251,244,245,.26);

    --serif:Georgia,"Times New Roman",serif;
    --sans:ui-sans-serif,system-ui,-apple-system,"Segoe UI Variable Display","Segoe UI",Roboto,"Helvetica Neue",sans-serif;
  }

  *{box-sizing:border-box;margin:0;padding:0}
  html{height:100%}

  body{
    height:100dvh;
    display:grid;
    place-items:center;
    padding:clamp(12px,2.4vw,34px);
    font-family:var(--serif);
    color:var(--texto);
    background:linear-gradient(168deg,var(--fondo-1) 0%,var(--fondo-2) 54%,var(--fondo-3) 100%);
    overflow:hidden;
    -webkit-font-smoothing:antialiased;
    -webkit-tap-highlight-color:transparent;
  }

  /* resplandor lento detrás de la tarjeta */
  .halo{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
  .halo span{position:absolute;border-radius:50%;filter:blur(96px);opacity:.38;will-change:transform}
  .halo span:nth-child(1){width:54vw;height:54vw;left:-14vw;top:-16vw;background:var(--vino-2);animation:vagar 30s ease-in-out infinite}
  .halo span:nth-child(2){width:46vw;height:46vw;right:-12vw;bottom:-14vw;background:#3d1038;animation:vagar 38s ease-in-out infinite reverse}
  @keyframes vagar{
    0%,100%{transform:translate3d(0,0,0) scale(1)}
    50%    {transform:translate3d(3vw,-4vh,0) scale(1.14)}
  }

  /* ═════════════════════════════════════════════
     LA TARJETA
     ═════════════════════════════════════════════ */
  .tarjeta{
    position:relative;z-index:2;
    width:min(1060px,100%);
    height:min(720px,100%);
    display:grid;
    grid-template-columns:minmax(0,44%) minmax(0,1fr);
    grid-template-rows:minmax(0,1fr) auto;
    grid-template-areas:"foto letra" "pie pie";
    gap:clamp(18px,3vw,46px);
    padding:clamp(18px,2.6vw,36px);
    border-radius:clamp(16px,2vw,26px);
    background:linear-gradient(152deg,var(--carta-1) 0%,var(--carta-2) 72%,#140709 100%);
    box-shadow:
      0 40px 90px rgba(0,0,0,.55),
      0 0 0 1px rgba(255,255,255,.07) inset;
  }

  /* ───── la foto ───── */
  .marco{
    grid-area:foto;
    justify-self:center;align-self:center;
    position:relative;
    height:100%;
    aspect-ratio:3/4;              /* la proporción de la foto, sin recortarla */
    max-width:100%;
    border-radius:clamp(10px,1.3vw,18px);
    overflow:hidden;
    background:linear-gradient(150deg,#3a0f22,#1b0810);
    box-shadow:
      0 30px 70px rgba(0,0,0,.6),
      0 0 0 1px rgba(255,255,255,.12) inset,
      0 0 0 7px rgba(255,255,255,.03);
  }
  .marco img,.marco svg{
    display:block;width:100%;height:100%;object-fit:cover;
    transform:scale(1);
    transition:transform 1.4s ease;
  }
  /* mientras suena, la foto respira muy despacio */
  body.sonando .marco img{animation:respirar 46s ease-in-out infinite alternate}
  @keyframes respirar{from{transform:scale(1)} to{transform:scale(1.07)}}

  /* solo una viñeta en los bordes, para que no flote recortada */
  .marco::after{
    content:'';position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(130% 100% at 50% 40%, transparent 54%, rgba(8,3,6,.42) 100%);
  }

  /* ───── la estrofa ───── */
  .lienzo{
    grid-area:letra;
    position:relative;
    display:flex;
    flex-direction:column;
    min-width:0;min-height:0;
  }

  /* la cabecera hace de portadilla: dice qué es esto sin estorbar */
  .cabecera{flex:0 0 auto;padding-bottom:clamp(14px,2vw,26px)}
  .cabecera__ojo{
    font:400 10px/1 var(--sans);letter-spacing:.32em;text-transform:uppercase;
    color:var(--tenue);margin-bottom:10px;
  }
  .cabecera__titulo{font:400 clamp(21px,2.2vw,28px)/1.1 var(--serif);letter-spacing:.01em}
  .cabecera__artista{
    font:400 10px/1 var(--sans);letter-spacing:.22em;text-transform:uppercase;
    color:var(--medio);margin-top:8px;
  }

  .centro{flex:1;display:flex;align-items:center;min-height:0}

  .firma{
    flex:0 0 auto;
    padding-top:clamp(14px,2vw,26px);
    font:italic 400 clamp(12px,1.2vw,14px)/1.5 var(--serif);
    color:var(--tenue);
  }
  .estrofa{
    width:100%;
    transition:opacity .34s ease;
  }
  .estrofa.entrando{opacity:0}

  .verso{
    font-family:var(--sans);
    font-weight:700;
    font-size:calc(var(--base,40px) * var(--w,1));
    line-height:1.06;
    letter-spacing:-.012em;
    white-space:pre-wrap;
    overflow-wrap:break-word;
    margin-bottom:.08em;
  }
  .verso:last-child{margin-bottom:0}

  /* cada letra aparece por su cuenta */
  .l{
    opacity:0;
    transition:opacity .22s ease;
  }
  .l.vista{opacity:1}

  /* tramos sin letra */
  .respiro{
    font-family:var(--serif);
    font-size:clamp(15px,1.5vw,20px);
    line-height:1.72;
    color:var(--medio);
    font-style:italic;
    max-width:30em;
  }
  .puntos{display:flex;gap:11px;align-items:center}
  .puntos i{width:10px;height:10px;border-radius:50%;background:var(--rosa);opacity:.45}
  .puntos i:nth-child(1){animation:pulso 1.6s ease-in-out infinite}
  .puntos i:nth-child(2){animation:pulso 1.6s ease-in-out .22s infinite}
  .puntos i:nth-child(3){animation:pulso 1.6s ease-in-out .44s infinite}
  @keyframes pulso{
    0%,100%{opacity:.22;transform:scale(.8)}
    45%    {opacity:.95;transform:scale(1.2)}
  }

  /* ═════════════════════════════════════════════
     EL PIE — reproductor al mínimo
     ═════════════════════════════════════════════ */
  .pie{
    grid-area:pie;
    display:flex;align-items:center;gap:clamp(12px,1.6vw,20px);
  }

  .play{
    flex:0 0 auto;
    display:grid;place-items:center;
    width:46px;height:46px;border:0;border-radius:50%;
    background:var(--texto);color:#1b0810;cursor:pointer;
    box-shadow:0 6px 20px rgba(0,0,0,.42);
    transition:transform .16s ease, opacity .2s;
  }
  .play:hover{transform:scale(1.07)}
  .play:active{transform:scale(.93)}
  .play svg{width:19px;height:19px;fill:currentColor}
  body.cargando .play{animation:latido 1.1s ease-in-out infinite}
  @keyframes latido{
    0%,100%{opacity:1;transform:scale(1)}
    50%    {opacity:.5;transform:scale(.93)}
  }

  .riel{position:relative;flex:1;height:22px;cursor:pointer;touch-action:none;min-width:0}
  .riel__via{position:absolute;left:0;right:0;top:50%;height:2px;margin-top:-1px;border-radius:2px;background:rgba(255,255,255,.14)}
  .riel__lleno{position:absolute;left:0;top:50%;height:2px;margin-top:-1px;width:0;border-radius:2px;background:linear-gradient(90deg,var(--vino-2),var(--rosa))}
  .riel__perilla{
    position:absolute;top:50%;left:0;width:10px;height:10px;margin:-5px 0 0 -5px;
    border-radius:50%;background:var(--texto);
    opacity:0;transform:scale(.5);transition:opacity .2s,transform .2s;
  }
  .riel:hover .riel__perilla,.riel.agarrada .riel__perilla{opacity:1;transform:scale(1)}

  .reloj{
    flex:0 0 auto;
    font:400 11px/1 var(--sans);color:var(--tenue);
    font-variant-numeric:tabular-nums;
  }
  .aviso{
    flex:0 0 auto;
    font:400 10px/1 var(--sans);letter-spacing:.12em;text-transform:uppercase;color:var(--tenue);
  }

  /* ═════════════════════════════════════════════
     INTRO
     ═════════════════════════════════════════════ */
  .intro{
    position:fixed;inset:0;z-index:40;
    display:grid;place-content:center;justify-items:center;gap:20px;
    text-align:center;padding:30px;
    background:linear-gradient(168deg,var(--fondo-1) 0%,var(--fondo-2) 56%,var(--fondo-3) 100%);
    transition:opacity .9s ease, visibility .9s;
  }
  .intro.ida{opacity:0;visibility:hidden;pointer-events:none}
  .intro__ojo{font:400 11px/1 var(--sans);letter-spacing:.3em;text-transform:uppercase;color:var(--tenue)}
  .intro__titulo{font:400 clamp(36px,7.5vw,68px)/1.04 var(--serif)}
  .intro__artista{font:400 14px/1.5 var(--sans);color:var(--medio);margin-top:-8px}
  .intro__play{
    margin-top:12px;display:inline-flex;align-items:center;gap:11px;
    padding:14px 30px 14px 24px;border:0;border-radius:999px;
    background:var(--texto);color:#1b0810;cursor:pointer;
    font:600 13px/1 var(--sans);letter-spacing:.08em;text-transform:uppercase;
    box-shadow:0 10px 34px rgba(0,0,0,.5);
    transition:transform .16s;
  }
  .intro__play:hover{transform:translateY(-2px) scale(1.03)}
  .intro__play svg{width:16px;height:16px;fill:currentColor}

  /* ═════════════════════════════════════════════
     TALLER — tecla S, solo para el autor
     ═════════════════════════════════════════════ */
  .taller{
    position:fixed;right:16px;bottom:16px;z-index:50;
    width:min(390px,calc(100vw - 32px));max-height:68dvh;overflow:auto;
    padding:18px;border-radius:14px;
    background:rgba(18,8,12,.97);
    border:1px solid rgba(255,255,255,.13);
    box-shadow:0 24px 60px rgba(0,0,0,.6);
    font-family:var(--sans);display:none;
  }
  .taller.abierto{display:block}
  .taller h2{font:600 11px/1 var(--sans);letter-spacing:.2em;text-transform:uppercase;color:var(--tenue);margin-bottom:12px}
  .taller p{font:400 12.5px/1.65 var(--sans);color:var(--medio);margin-bottom:12px}
  .taller__estado{font:500 12px/1.5 var(--sans);color:var(--rosa);margin-bottom:10px;min-height:1.5em}
  .taller__fila{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
  .taller button{
    padding:9px 14px;border:1px solid rgba(255,255,255,.18);border-radius:8px;
    background:rgba(255,255,255,.05);color:var(--texto);cursor:pointer;
    font:500 12.5px/1 var(--sans);
  }
  .taller button:hover{background:rgba(255,255,255,.12)}
  .taller code{font:400 11.5px/1 ui-monospace,Consolas,monospace;color:var(--rosa-2)}

  /* ═════════════════════════════════════════════
     MÓVIL — la misma tarjeta, de pie
     ═════════════════════════════════════════════ */
  @media (max-width:820px){
    body{padding:0}
    .tarjeta{
      width:100%;height:100%;
      border-radius:0;
      grid-template-columns:minmax(0,1fr);
      grid-template-rows:auto minmax(0,1fr) auto;
      grid-template-areas:"foto" "letra" "pie";
      gap:clamp(14px,3.4vw,24px);
      padding:calc(16px + env(safe-area-inset-top)) 20px calc(16px + env(safe-area-inset-bottom));
      box-shadow:none;
      background:transparent;
    }
    .marco{
      justify-self:center;
      height:min(40dvh,360px);
      aspect-ratio:3/4;
    }
    .cabecera{padding-bottom:14px}
    .cabecera__ojo{margin-bottom:7px}
    .cabecera__artista{margin-top:5px}
    .firma{padding-top:12px}
    .reloj{display:none}
  }

  /* pantallas muy bajas: la foto estorba más de lo que aporta */
  @media (max-height:560px) and (max-width:820px){
    .marco{height:26dvh}
    .cabecera__artista,.firma{display:none}
  }

  @media (prefers-reduced-motion:reduce){
    .halo span,.puntos i{animation:none}
    .l,.estrofa{transition:none}
  }
</style>
</head>
<body>

<div class="halo" aria-hidden="true"><span></span><span></span></div>

<main class="tarjeta">
  <div class="marco" id="marco" aria-hidden="true"></div>

  <div class="lienzo">
    <header class="cabecera">
      <p class="cabecera__ojo"     id="rOjo"></p>
      <h1 class="cabecera__titulo" id="rTitulo"></h1>
      <p class="cabecera__artista" id="rArtista"></p>
    </header>

    <div class="centro" id="centro">
      <div class="estrofa" id="estrofa"></div>
    </div>

    <p class="firma" id="rFirma"></p>
  </div>

  <div class="pie">
    <button class="play" id="btnPlay" type="button" aria-label="Reproducir">
      <svg id="icoPlay" viewBox="0 0 24 24"><path d="M7 4.5v15l13-7.5z"/></svg>
    </button>

    <div class="riel" id="rielTiempo" role="slider" aria-label="Posición de la canción" tabindex="0">
      <div class="riel__via"></div>
      <div class="riel__lleno" id="llenoTiempo"></div>
      <div class="riel__perilla" id="perillaTiempo"></div>
    </div>

    <span class="reloj" id="reloj">0:00</span>
    <span class="aviso" id="aviso"></span>
  </div>
</main>

<div class="intro" id="intro">
  <p class="intro__ojo" id="iOjo"></p>
  <h1 class="intro__titulo" id="iTitulo"></h1>
  <p class="intro__artista" id="iArtista"></p>
  <button class="intro__play" id="btnEmpezar" type="button">
    <svg viewBox="0 0 24 24"><path d="M7 4.5v15l13-7.5z"/></svg>
    escuchar
  </button>
</div>

<div class="taller" id="taller">
  <h2>Taller · solo lo ves tú</h2>
  <div class="taller__estado" id="tEstado"></div>
  <p>Arrastra encima el audio, el <code>.lrc</code> o la foto para probarlos sin subirlos al repositorio.</p>
  <div class="taller__fila">
    <button type="button" id="tArchivo">Abrir archivos…</button>
    <button type="button" id="tMas">Estrofas más largas</button>
    <button type="button" id="tMenos">Más cortas</button>
  </div>
  <p id="tInfo"></p>
</div>

<input type="file" id="archivos" accept="audio/*,image/*,.lrc,.txt" multiple hidden>
<audio id="audio" preload="metadata"></audio>

<script>
/* ═══════════════════════════════════════════════════════════════
   1. PERSONALIZABLE — edita este bloque y nada más
   ═══════════════════════════════════════════════════════════════ */

const CANCION = {
  titulo:  "Parcera",
  artista: "Penyair",
  ojo:     "tu canción",

  /* La foto de los dos: es la portada de la tarjeta. Si no está, en
     su sitio va una flor dibujada.                                */
  foto:    "assets/imagen.jpg",

  /* Va pequeñita abajo, bajo la letra. Déjala en "" para quitarla. */
  firma:   "para Sofi",

  /* Audio y letra sincronizada, servidos estáticos por GitHub Pages. */
  audio:   "assets/archivomulti.mp3",
  letra:   "assets/archivomulti.lrc",

  /* Lo que se lee en los silencios largos. Déjalo en "" para que
     salgan solo tres puntos.                                      */
  respiro: "",

  /* Solo se usa si no hay audio; con el archivo manda su duración. */
  duracion: 192
};

const CONFIG = {
  volumen:   0.85,
  repetir:   false,
  mayusculas:false,  // en mayúsculas grita; el .lrc ya trae buena caja
  saltar:    10,     // segundos de las flechas

  /* Cómo se parten los versos en estrofas. Un silencio más largo que
     `corte` empieza estrofa nueva, y ninguna pasa de `maxVersos`.   */
  maxVersos: 2,
  corte:     2.6,
  maxVerso:  6,      // segundos máximos que tarda un verso en revelarse

  /* Cada verso se parte en trozos. De ahí sale el aire de las
     historias: unos trozos enormes y otros pequeños. El patrón son
     anchos OBJETIVO EN CARACTERES, no en palabras: contar palabras
     no sirve, porque una larga mide casi lo mismo que dos cortas.
     Ponlo en false para que cada verso ocupe una sola línea.      */
  trocear:   true,
  patron:    [4, 19, 10, 5, 15, 24, 7],

  /* Los anchos del patrón se escalan para que cada tarjeta ronde
     este número de líneas, lleve un verso o lleve dos. Sin esto,
     una tarjeta de dos versos salía en nueve líneas diminutas.  */
  lineasPorTarjeta: 4,

  /* El tamaño de cada trozo es `fuerza / letras^contraste`, acotado.
     Sube `contraste` para que la diferencia entre el trozo corto y el
     largo sea más bestia; bájalo para igualarlos.                   */
  fuerza:    4.2,
  contraste: 0.58,
  pesoMin:   0.55,
  pesoMax:   1.65,

  /* Tope duro del trozo más grande, en píxeles: una fracción del ancho
     disponible, acotada. Es lo que impide que la letra se desmadre en
     pantallas anchas y lo que la mantiene por debajo de la foto.     */
  cuerpo:    0.15,
  cuerpoMin: 40,
  cuerpoMax: 76
};

/* Letra de reserva. Solo se ve si el .lrc no carga: por ejemplo al
   abrir este archivo con doble clic, porque entonces el navegador no
   deja leer archivos vecinos. */
const LETRA = [
  [ 0, ""],
  [ 6, "Son las siete"],
  [10, "y todavía estás contando"],
  [15, "cómo te fue en el turno de hoy"],
  [21, "y yo tenía algo importante que decirte"],
  [27, "pero se me olvidó"]
];

/* ═══════════════════════════════════════════════════════════════
   2. MOTOR — de aquí para abajo no hace falta tocar nada
   ═══════════════════════════════════════════════════════════════ */

const $ = id => document.getElementById(id);
const audio   = $("audio");
const estrofa = $("estrofa");
const centro  = $("centro");

let hayAudio = false;   // el archivo suena y manda su reloj
let sinAudio = false;   // ya sabemos que no hay: va el reloj interno
let probando = false;   // play() lanzado, esperando a ver si suena
let intento  = 0;       // descarta los intentos que se cancelaron

let sonando    = false;
let posVirtual = 0;
let t0Virtual  = 0;
let raf        = 0;

let ESTROFAS = [];
let iEstrofa = -1;
let vivos    = [];      // versos en pantalla: [{ini, fin, letras, n}]

/* ───────── la foto ───────── */
function ponerFoto(url){
  const marco = $("marco");
  const img = new Image();
  img.alt = "";
  img.onload  = () => { marco.innerHTML = ""; marco.appendChild(img); };
  img.onerror = () => { if (!marco.children.length) dibujarFlor(marco); };
  img.src = url;
}

/* Si no hay foto, una flor. Nada de archivos externos. */
function dibujarFlor(destino){
  const NS = "http://www.w3.org/2000/svg";
  const svg = document.createElementNS(NS, "svg");
  svg.setAttribute("viewBox", "0 0 200 250");
  svg.setAttribute("preserveAspectRatio", "xMidYMid slice");
  svg.innerHTML =
    '<defs>' +
      '<radialGradient id="gp" cx="50%" cy="76%" r="78%">' +
        '<stop offset="0%" stop-color="#f8d4dd"/>' +
        '<stop offset="54%" stop-color="#e58ba4"/>' +
        '<stop offset="100%" stop-color="#9e2049"/>' +
      '</radialGradient>' +
      '<radialGradient id="gc" cx="42%" cy="36%" r="72%">' +
        '<stop offset="0%" stop-color="#7a1734"/>' +
        '<stop offset="100%" stop-color="#2b0711"/>' +
      '</radialGradient>' +
    '</defs>';

  const cx = 100, cy = 125;
  const petalo = (r0, r1, w) => {
    const L = r1 - r0, y = k => (cy - (r0 + L * k)).toFixed(2);
    return "M" + cx + " " + (cy - r0).toFixed(2) +
      " C" + (cx - w * .46) + " " + y(.14) + " " + (cx - w) + " " + y(.52) + " " + (cx - w * .78) + " " + y(.86) +
      " C" + (cx - w * .46) + " " + y(1.04) + " " + (cx + w * .46) + " " + y(1.04) + " " + (cx + w * .78) + " " + y(.86) +
      " C" + (cx + w) + " " + y(.52) + " " + (cx + w * .46) + " " + y(.14) + " " + cx + " " + (cy - r0).toFixed(2) + "Z";
  };

  [{n:24,r0:26,r1:104,w:8.6,op:.95,g:0},
   {n:20,r0:21,r1:78,w:7,op:.8,g:9},
   {n:16,r0:16,r1:54,w:5.6,op:.62,g:15}].forEach(a => {
    const g = document.createElementNS(NS, "g");
    g.setAttribute("opacity", a.op);
    for (let i = 0; i < a.n; i++){
      const p = document.createElementNS(NS, "path");
      p.setAttribute("d", petalo(a.r0, a.r1 * (0.92 + Math.random() * 0.16), a.w));
      p.setAttribute("fill", "url(#gp)");
      p.setAttribute("transform", "rotate(" + ((360 / a.n) * i + a.g).toFixed(2) + " " + cx + " " + cy + ")");
      g.appendChild(p);
    }
    svg.appendChild(g);
  });

  const c = document.createElementNS(NS, "circle");
  c.setAttribute("cx", cx); c.setAttribute("cy", cy);
  c.setAttribute("r", "19"); c.setAttribute("fill", "url(#gc)");
  svg.appendChild(c);

  destino.innerHTML = "";
  destino.appendChild(svg);
}

/* ───────── leer un .lrc ─────────
   Formato estándar de letra sincronizada: un sello [mm:ss.cc] delante
   de cada verso. Admite varios sellos por línea, la variante con dos
   puntos en las centésimas, las cabeceras y el desfase [offset:].   */
function leerLRC(txt){
  const sello = /\[(\d{1,2}):(\d{2})(?:[.:](\d{1,3}))?\]/g;
  let desfase = 0;
  const bruto = [];

  txt.replace(/^﻿/, "").split(/\r?\n/).forEach(cruda => {
    const off = cruda.match(/^\s*\[offset:\s*([+-]?\d+)\s*\]/i);
    if (off){ desfase = parseInt(off[1], 10) / 1000; return; }
    if (/^\s*\[[a-z]{2,}:/i.test(cruda)) return;

    sello.lastIndex = 0;
    const tiempos = [];
    let m;
    while ((m = sello.exec(cruda))){
      const mil = (m[3] || "0").padEnd(3, "0").slice(0, 3);
      tiempos.push((+m[1]) * 60 + (+m[2]) + (+mil) / 1000);
    }
    if (!tiempos.length) return;
    const texto = cruda.replace(sello, "").trim();
    tiempos.forEach(t => bruto.push([+(t + desfase).toFixed(2), texto]));
  });

  if (!bruto.length) return null;
  bruto.sort((a, b) => a[0] - b[0]);

  /* Un verso vacío que dura un parpadeo no es silencio: es la marca
     con la que el formato borra de pantalla el verso anterior.     */
  const fin = duracion();
  return bruto.filter((e, i) => {
    if (e[1]) return true;
    const sig = i + 1 < bruto.length ? bruto[i + 1][0] : (fin || e[0] + 99);
    return sig - e[0] >= 2.5;
  });
}

/* ───────── de versos sueltos a estrofas ───────── */
function armarEstrofas(){
  const fin = duracion();
  const E = [];
  let act = null;
  const cerrar = () => { if (act){ act.fin = act.ultimo; E.push(act); act = null; } };

  LETRA.forEach((e, i) => {
    const t = e[0], txt = e[1];
    const sig = (i + 1 < LETRA.length) ? LETRA[i + 1][0] : fin;

    if (!txt){                       // silencio
      cerrar();
      E.push({ hueco:true, ini:t, fin:sig });
      return;
    }
    /* Un verso no tarda en revelarse más de lo razonable aunque el
       siguiente llegue mucho después: lo que sobra es silencio.    */
    const hasta = Math.min(sig, t + CONFIG.maxVerso);

    /* El corte mira la distancia entre ARRANQUES. En un .lrc el final
       de un verso es el arranque del siguiente, así que medir contra
       el final daría cero siempre y nunca partiría.                 */
    if (act && (act.versos.length >= CONFIG.maxVersos || t - act.ultimoIni > CONFIG.corte)) cerrar();
    if (!act) act = { ini:t, versos:[] };
    act.versos.push({ ini:t, fin:hasta, txt });
    act.ultimoIni = t;
    act.ultimo    = hasta;
  });
  cerrar();

  /* Un respiro al entrar y otro al cerrar, si hay sitio. */
  if (E.length && E[0].ini > 1.5) E.unshift({ hueco:true, ini:0, fin:E[0].ini });
  const ult = E[E.length - 1];
  if (ult && fin - ult.fin > 6) E.push({ hueco:true, ini:ult.fin, fin:fin });

  ESTROFAS = E;
  iEstrofa = -1;
}

/* ───────── pintar una estrofa ───────── */
const peso = n => +Math.min(CONFIG.pesoMax,
                   Math.max(CONFIG.pesoMin,
                   CONFIG.fuerza / Math.pow(Math.max(2, n), CONFIG.contraste))).toFixed(3);

/* Parte un verso en trozos de anchos desiguales. El patrón rota con
   la semilla para que dos estrofas seguidas no se corten igual.   */
function trocear(palabras, semilla, escala){
  const pat = CONFIG.patron, trozos = [];
  let i = 0, k = Math.abs(semilla) % pat.length;
  while (i < palabras.length){
    const meta = pat[k++ % pat.length] * escala;
    let tr = palabras[i++];                       // siempre al menos una
    while (i < palabras.length && tr.length + 1 + palabras[i].length <= meta){
      tr += " " + palabras[i++];
    }
    trozos.push(tr);
  }
  return trozos;
}

/* Cuánto hay que ensanchar el patrón para que la tarjeta quepa en
   las líneas previstas. */
function escalaDe(versos){
  const total = versos.reduce((s, v) => s + v.txt.length, 0);
  const medio = CONFIG.patron.reduce((a, b) => a + b, 0) / CONFIG.patron.length;
  const quiere = total / Math.max(1, CONFIG.lineasPorTarjeta);
  return Math.max(0.7, Math.min(3, quiere / medio));
}

function pintarEstrofa(e){
  estrofa.classList.add("entrando");
  estrofa.innerHTML = "";
  estrofa.style.removeProperty("--base");
  vivos = [];

  if (!e){ estrofa.classList.remove("entrando"); return; }

  if (e.hueco){
    if (CANCION.respiro){
      const p = document.createElement("p");
      p.className = "respiro";
      p.textContent = CANCION.respiro;
      estrofa.appendChild(p);
    } else {
      const d = document.createElement("div");
      d.className = "puntos";
      d.innerHTML = "<i></i><i></i><i></i>";
      estrofa.appendChild(d);
    }
  } else {
    const escala = escalaDe(e.versos);
    var mayorPeso = 0;
    e.versos.forEach((v, vi) => {
      const texto  = CONFIG.mayusculas ? v.txt.toLocaleUpperCase("es") : v.txt;
      const trozos = CONFIG.trocear
        ? trocear(texto.split(/\s+/).filter(Boolean), vi + Math.round(v.ini), escala)
        : [texto];
      const letras = [];
      trozos.forEach(tr => {
        const w = peso(tr.length);
        if (w > mayorPeso) mayorPeso = w;
        const p = document.createElement("p");
        p.className = "verso";
        p.style.setProperty("--w", w);
        for (const ch of tr){
          const s = document.createElement("span");
          s.className = "l";
          s.textContent = ch;
          p.appendChild(s);
          letras.push(s);          // el verso se revela seguido, trozo tras trozo
        }
        estrofa.appendChild(p);
      });
      vivos.push({ ini:v.ini, fin:v.fin, letras, n:0 });
    });
    encajar(mayorPeso);
  }

  void estrofa.offsetWidth;            // reflujo forzado antes de aparecer
  estrofa.classList.remove("entrando");
}

/* Busca por bisección el cuerpo de letra más grande con el que la
   estrofa entera sigue cabiendo en su hueco.                      */
function encajar(mayorPeso){
  const alto = centro.clientHeight;
  if (!alto) return;

  /* Dos topes a la vez: que la estrofa quepa de alto, y que el trozo
     más grande no pase del cuerpo máximo. Manda el más estricto.   */
  const tope = Math.min(CONFIG.cuerpoMax,
               Math.max(CONFIG.cuerpoMin, centro.clientWidth * CONFIG.cuerpo));
  let bajo = 10, cima = tope / Math.max(0.2, mayorPeso || 1);

  for (let i = 0; i < 9; i++){
    const med = (bajo + cima) / 2;
    estrofa.style.setProperty("--base", med.toFixed(2) + "px");
    if (estrofa.scrollHeight <= alto) bajo = med; else cima = med;
  }
  estrofa.style.setProperty("--base", bajo.toFixed(2) + "px");
}

/* ───────── revelar letra a letra ───────── */
function revelar(p){
  for (let k = 0; k < vivos.length; k++){
    const v = vivos[k];
    const total = v.letras.length;
    let n;
    if (p >= v.fin) n = total;
    else if (p <= v.ini) n = 0;
    else n = Math.floor((p - v.ini) / Math.max(.35, (v.fin - v.ini) * .92) * total);
    n = n < 0 ? 0 : (n > total ? total : n);
    if (n === v.n) continue;
    if (n > v.n) for (let i = v.n; i < n; i++) v.letras[i].classList.add("vista");
    else         for (let i = n; i < v.n; i++) v.letras[i].classList.remove("vista");
    v.n = n;
  }
}

/* ───────── tiempo ───────── */
function pos(){
  if (hayAudio) return audio.currentTime || 0;
  if (sonando)  return Math.min(duracion(), (performance.now() - t0Virtual) / 1000);
  return posVirtual;
}
function duracion(){
  if (hayAudio && isFinite(audio.duration) && audio.duration > 0) return audio.duration;
  return CANCION.duracion;
}
function reloj(s){
  s = Math.max(0, Math.floor(s || 0));
  return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0");
}
function irA(t){
  const d = duracion();
  t = Math.min(d - 0.05, Math.max(0, t));
  if (hayAudio) audio.currentTime = t;
  else { posVirtual = t; t0Virtual = performance.now() - t * 1000; }
  marco();
}

function indiceEstrofa(p){
  let i = -1;
  for (let k = 0; k < ESTROFAS.length; k++){
    if (ESTROFAS[k].ini <= p) i = k; else break;
  }
  return i;
}

/* un fotograma */
function marco(){
  const p = pos(), d = duracion();
  const pc = d ? Math.min(1, p / d) : 0;
  $("llenoTiempo").style.width = (pc * 100) + "%";
  $("perillaTiempo").style.left = (pc * 100) + "%";
  $("reloj").textContent = reloj(p) + " / " + reloj(d);

  const i = indiceEstrofa(p);
  if (i !== iEstrofa){ iEstrofa = i; pintarEstrofa(ESTROFAS[i]); }
  revelar(p);

  if (!hayAudio && sonando && p >= d - 0.05) terminar();
}
function latir(){
  marco();
  if (sonando) raf = requestAnimationFrame(latir);
}

/* ───────── mandos ─────────
   El toque del usuario es lo que carga el audio, no solo lo que lo
   arranca: Safari en iPhone ignora el preload y no pide un byte
   hasta que hay un gesto.                                         */
function tocar(){
  if (sonando || probando) return;

  if (!sinAudio){
    const mio = ++intento;
    probando = true;
    document.body.classList.add("cargando");
    $("aviso").textContent = "cargando";

    Promise.resolve(audio.play()).then(() => {
      if (mio !== intento) return;
      probando = false;
      hayAudio = true;
      document.body.classList.remove("cargando");
      $("aviso").textContent = "";
      arrancar();
    }).catch(() => {
      if (mio !== intento) return;
      probando = false;
      document.body.classList.remove("cargando");
      if (audio.error){
        sinAudio = true;
        hayAudio = false;
        $("aviso").textContent = "solo letra";
        arrancar();
      } else {
        $("aviso").textContent = "";
      }
    });
    return;
  }
  arrancar();
}

function arrancar(){
  sonando = true;
  document.body.classList.add("sonando");
  $("icoPlay").innerHTML = '<path d="M6.5 4.5h4v15h-4zM13.5 4.5h4v15h-4z"/>';
  $("btnPlay").setAttribute("aria-label", "Pausar");
  if (!hayAudio) t0Virtual = performance.now() - posVirtual * 1000;
  cancelAnimationFrame(raf);
  raf = requestAnimationFrame(latir);
}
function pausar(){
  if (!sonando) return;
  posVirtual = pos();
  sonando = false;
  document.body.classList.remove("sonando");
  $("icoPlay").innerHTML = '<path d="M7 4.5v15l13-7.5z"/>';
  $("btnPlay").setAttribute("aria-label", "Reproducir");
  if (hayAudio) audio.pause();
  cancelAnimationFrame(raf);
  marco();
}
function alternar(){
  if (probando){
    intento++;
    probando = false;
    audio.pause();
    document.body.classList.remove("cargando");
    $("aviso").textContent = "";
    return;
  }
  sonando ? pausar() : tocar();
}
function terminar(){
  if (CONFIG.repetir){ irA(0); return; }
  pausar();
  irA(0);
}

/* ───────── arrastre del riel ───────── */
function riel(el, alMover){
  let agarrado = false;
  const leer = ev => {
    const r = el.getBoundingClientRect();
    return Math.min(1, Math.max(0, (ev.clientX - r.left) / r.width));
  };
  el.addEventListener("pointerdown", ev => {
    agarrado = true;
    el.classList.add("agarrada");
    el.setPointerCapture(ev.pointerId);
    alMover(leer(ev));
  });
  el.addEventListener("pointermove", ev => { if (agarrado) alMover(leer(ev)); });
  const soltar = ev => {
    if (!agarrado) return;
    agarrado = false;
    el.classList.remove("agarrada");
    try { el.releasePointerCapture(ev.pointerId); } catch (_){}
  };
  el.addEventListener("pointerup", soltar);
  el.addEventListener("pointercancel", soltar);
}

/* ───────── cambiar la letra en caliente ───────── */
function ponerLetra(arr){
  if (!arr || !arr.length) return 0;
  LETRA.length = 0;
  arr.forEach(e => LETRA.push(e));
  armarEstrofas();
  marco();
  return LETRA.length;
}

/* ═══════════════════════════════════════════════════════════════
   3. TALLER — tecla S
   ═══════════════════════════════════════════════════════════════ */
function estado(txt){ $("tEstado").textContent = txt || ""; }

function info(){
  const versos  = LETRA.filter(e => e[1]).length;
  const bloques = ESTROFAS.filter(e => !e.hueco).length;
  $("tInfo").innerHTML =
    versos + " versos en " + bloques + " estrofas · corte en " +
    CONFIG.corte.toFixed(1) + " s, máximo " + CONFIG.maxVersos + " versos.<br>" +
    "Si la letra va desfasada, ponle <code>[offset:-500]</code> al principio del .lrc.";
}

function abrirTaller(v){
  const t = $("taller");
  const abierto = v === undefined ? !t.classList.contains("abierto") : v;
  t.classList.toggle("abierto", abierto);
  if (abierto){
    estado(hayAudio ? "Audio cargado · " + reloj(duracion()) : (sinAudio ? "Sin audio" : "Audio por cargar"));
    info();
  }
}

function reagrupar(delta){
  CONFIG.maxVersos = Math.max(1, Math.min(6, CONFIG.maxVersos + delta));
  CONFIG.corte     = Math.max(1.2, Math.min(6, +(CONFIG.corte + delta * 0.4).toFixed(1)));
  armarEstrofas();
  marco();
  info();
  estado("Reagrupado");
}

/* ═══════════════════════════════════════════════════════════════
   4. ARRANQUE
   ═══════════════════════════════════════════════════════════════ */
(function inicio(){
  $("rTitulo").textContent  = CANCION.titulo;
  $("rArtista").textContent = CANCION.artista;
  $("rOjo").textContent     = CANCION.ojo;
  $("rFirma").textContent   = CANCION.firma || "";
  $("iOjo").textContent     = CANCION.ojo;
  $("iTitulo").textContent  = CANCION.titulo;
  $("iArtista").textContent = CANCION.artista;
  document.title = CANCION.titulo;

  if (CANCION.foto) ponerFoto(CANCION.foto); else dibujarFlor($("marco"));

  armarEstrofas();

  if (CANCION.audio){
    audio.src = CANCION.audio;
    audio.addEventListener("loadedmetadata", () => {
      hayAudio = true;
      armarEstrofas();      // ahora se conoce la duración real
      marco();
    }, { once:true });
    audio.addEventListener("error", () => {
      sinAudio = true;
      hayAudio = false;
      $("aviso").textContent = "solo letra";
      marco();
    });
  } else {
    sinAudio = true;
    $("aviso").textContent = "solo letra";
  }
  audio.addEventListener("waiting", () => { if (hayAudio && sonando) $("aviso").textContent = "cargando"; });
  audio.addEventListener("playing", () => { $("aviso").textContent = ""; });
  audio.addEventListener("ended", terminar);
  audio.addEventListener("timeupdate", marco);   // respaldo si el rAF se frena

  document.addEventListener("visibilitychange", () => {
    if (!document.hidden && sonando){ cancelAnimationFrame(raf); raf = requestAnimationFrame(latir); }
  });

  /* la letra sincronizada vive en su propio archivo */
  if (CANCION.letra){
    fetch(CANCION.letra, { cache:"no-cache" })
      .then(r => r.ok ? r.text() : Promise.reject(r.status))
      .then(t => { const arr = leerLRC(t); if (arr) ponerLetra(arr); })
      .catch(() => {});
  }

  audio.volume = CONFIG.volumen;
  marco();

  $("btnPlay").addEventListener("click", alternar);
  riel($("rielTiempo"), k => irA(k * duracion()));

  $("btnEmpezar").addEventListener("click", () => {
    $("intro").classList.add("ida");
    iEstrofa = -1;          // repinta ya, con el hueco medido de verdad
    marco();
    tocar();
  });

  addEventListener("keydown", e => {
    const k = e.key.toLowerCase();
    if (e.key === " " || k === "k"){ e.preventDefault(); alternar(); }
    else if (e.key === "ArrowRight"){ e.preventDefault(); irA(pos() + CONFIG.saltar); }
    else if (e.key === "ArrowLeft") { e.preventDefault(); irA(pos() - CONFIG.saltar); }
    else if (k === "s"){ abrirTaller(); }
    else if (e.key === "Escape"){ abrirTaller(false); }
  });

  /* taller */
  $("tArchivo").addEventListener("click", () => $("archivos").click());
  $("archivos").addEventListener("change", ev => tragar(ev.target.files));
  $("tMas").addEventListener("click", () => reagrupar(+1));
  $("tMenos").addEventListener("click", () => reagrupar(-1));

  addEventListener("dragover", ev => ev.preventDefault());
  addEventListener("drop", ev => { ev.preventDefault(); tragar(ev.dataTransfer && ev.dataTransfer.files); });

  function tragar(lista){
    if (!lista) return;
    Array.prototype.forEach.call(lista, f => {
      if (/^audio\//.test(f.type) || /\.(mp3|m4a|ogg|wav)$/i.test(f.name)) usarAudio(f);
      else if (/^image\//.test(f.type)){ ponerFoto(URL.createObjectURL(f)); estado("Foto puesta · " + f.name); }
      else if (/\.(lrc|txt)$/i.test(f.name)) f.text().then(t => {
        const arr = leerLRC(t);
        if (arr && ponerLetra(arr)){ estado(LETRA.length + " versos desde " + f.name); info(); }
        else estado("No pude leer " + f.name);
      });
    });
  }

  function usarAudio(f){
    pausar();
    audio.src = URL.createObjectURL(f);
    audio.load();
    audio.addEventListener("loadedmetadata", () => {
      sinAudio = false;
      hayAudio = true;
      $("aviso").textContent = "";
      armarEstrofas();
      marco();
      estado("Audio cargado · " + f.name);
    }, { once:true });
  }

  /* al cambiar de tamaño hay que volver a encajar la estrofa */
  let ajuste;
  addEventListener("resize", () => {
    clearTimeout(ajuste);
    /* Repintar a secas dejaría la estrofa en blanco: nace con todas las
       letras ocultas y, en pausa, no hay fotograma que las revele.
       Pasando por marco() se repinta y se revela de una.              */
    ajuste = setTimeout(() => { iEstrofa = -1; marco(); }, 140);
  });
})();
</script>
