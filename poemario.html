<!DOCTYPE html>
<html lang="es-CO">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Un librito para ti</title>
<style>
  /* ═════════════════════════════════════════════
     TOKENS
     ═════════════════════════════════════════════ */
  :root{
    --noche-1:#241528;
    --noche-2:#160d19;
    --noche-3:#080509;

    --papel:#f2e7d2;
    --papel-2:#e7d9bd;
    --papel-borde:#d3c1a0;
    --tinta:#3c2a22;
    --tinta-2:#6b5442;
    --tinta-3:rgba(60,42,34,.5);

    --cuero-1:#5b2340;
    --cuero-2:#33122470;
    --oro:#e0b878;
    --oro-2:#f5dcae;

    --serif:Georgia,"Times New Roman",serif;
    --ease:cubic-bezier(.36,.06,.16,1);
    --giro:1.05s;
  }

  /* Medida de arranque. El tamaño real lo calcula medir() en JS a
     partir del hueco disponible: en móvil `vh` es el viewport
     grande —el que incluye la barra de direcciones— y el libro
     quedaría más alto que el espacio que de verdad se ve. */
  body{
    --pw:min(44vw, 46vh, 360px);
    --ph:calc(var(--pw) * 1.42);
  }

  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  @supports (height:100dvh){ html,body{height:100dvh} }

  body{
    font-family:var(--serif);
    color:rgba(247,235,222,.6);
    background:
      radial-gradient(70% 45% at 50% 0%, rgba(224,184,120,.10) 0%, transparent 62%),
      linear-gradient(172deg, var(--noche-1) 0%, var(--noche-2) 50%, var(--noche-3) 100%);
    overflow:hidden;
    display:flex;flex-direction:column;
    -webkit-font-smoothing:antialiased;
    -webkit-tap-highlight-color:transparent;
  }

  /* motas de polvo */
  .mota{
    position:fixed;z-index:1;pointer-events:none;
    left:var(--x);bottom:-4vh;
    width:var(--p);height:var(--p);border-radius:50%;
    background:radial-gradient(circle, rgba(245,220,174,.9), transparent 68%);
    opacity:0;
    animation:flotar var(--dur) linear infinite;
    animation-delay:var(--del);
    will-change:transform,opacity;
  }
  @keyframes flotar{
    0%{transform:translate3d(0,0,0);opacity:0}
    15%{opacity:.5}
    85%{opacity:.3}
    100%{transform:translate3d(var(--dx),-106vh,0);opacity:0}
  }

  /* ═════════════════════════════════════════════
     ESCENA Y LIBRO
     ═════════════════════════════════════════════ */
  .escena{
    flex:1;min-height:0;
    display:grid;place-items:center;
    perspective:2600px;
    perspective-origin:50% 42%;
    z-index:5;
    padding:clamp(8px,2vh,20px) 0;
  }

  .libro{
    position:relative;
    width:calc(var(--pw) * 2);
    height:var(--ph);
    transform-style:preserve-3d;
    transform:translateX(-25%);
    transition:transform .9s var(--ease);
  }
  body.abierto .libro{transform:translateX(0)}
  body.una-pagina .libro{width:var(--pw);transform:none}

  /* canto: el bloque de páginas que asoma */
  .canto{
    position:absolute;top:1.2%;bottom:1.2%;
    width:48.5%;
    border-radius:3px;
    background:
      repeating-linear-gradient(90deg,
        rgba(190,170,138,.85) 0 1px, rgba(236,224,200,.9) 1px 3px);
    box-shadow:0 22px 50px rgba(0,0,0,.55);
    transform:translateZ(-2px);
  }
  .canto--der{left:50%}
  .canto--izq{right:50%;opacity:0;transition:opacity .6s .25s}
  body.abierto .canto--izq{opacity:1}
  body.una-pagina .canto--izq{display:none}
  body.una-pagina .canto--der{left:0;width:97%}

  /* ── una hoja ── */
  .hoja{
    position:absolute;top:0;left:50%;
    width:50%;height:100%;
    transform-style:preserve-3d;
    /* el eje del giro es el lomo, no el centro de la hoja */
    transform-origin:0 50%;
    transform:translateZ(var(--z,0px)) rotateY(0deg);
    transition:transform var(--giro) var(--ease);
  }
  body.una-pagina .hoja{left:0;width:100%}
  .hoja.volteada{transform:translateZ(var(--z,0px)) rotateY(-180deg)}
  .hoja.girando{will-change:transform}

  /* Cada cara es una textura del tamaño de la página: en un móvil a
     3x son varios MB por cara. Las hojas lejanas se sacan del árbol
     de render, que es la diferencia entre ir fluido y no ir. */
  .hoja.oculta{display:none}

  /* al ir a un poema desde el panel las hojas pasan más rápido */
  .libro.pasando{--giro:.58s}

  .cara{
    position:absolute;inset:0;
    backface-visibility:hidden;
    -webkit-backface-visibility:hidden;
    overflow:hidden;
    display:flex;flex-direction:column;
    border-radius:2px 5px 5px 2px;
    background:
      linear-gradient(90deg, rgba(150,120,80,.14) 0%, transparent 9%),
      repeating-linear-gradient(0deg, rgba(120,90,60,.022) 0 2px, transparent 2px 4px),
      radial-gradient(120% 90% at 78% 12%, #f7eeda 0%, var(--papel) 48%, var(--papel-2) 100%);
    color:var(--tinta);
    box-shadow:inset 0 0 40px rgba(150,115,70,.13);
  }
  .cara--dorso{transform:rotateY(180deg)}

  /* sombra que barre la página durante el giro */
  .velo{
    position:absolute;inset:0;pointer-events:none;z-index:9;
    background:linear-gradient(90deg, rgba(40,22,10,.55), rgba(40,22,10,.05) 62%, transparent);
    opacity:0;
  }
  .hoja.girando .velo{animation:barrido var(--giro) var(--ease)}
  @keyframes barrido{0%,100%{opacity:0}48%{opacity:1}}

  /* ═════════════════════════════════════════════
     CONTENIDO DE LAS PÁGINAS
     ═════════════════════════════════════════════ */
  .pag{
    flex:1;min-height:0;
    display:flex;flex-direction:column;
    padding:clamp(20px,4.4%,40px) clamp(18px,7%,42px) clamp(26px,5%,38px);
    position:relative;
    overflow-y:auto;overscroll-behavior:contain;
  }
  .pag::-webkit-scrollbar{width:4px}
  .pag::-webkit-scrollbar-thumb{background:rgba(107,84,66,.22);border-radius:2px}

  /* centra el contenido cuando cabe y deja desplazar cuando no.
     Con justify-content:center un texto largo se recorta por
     arriba y no hay forma de alcanzarlo; con margin auto, no. */
  .pag__cuerpo{margin:auto 0;width:100%}

  .folio{
    flex:none;
    margin-top:clamp(8px,2.4%,16px);
    text-align:center;
    font-size:clamp(8.5px,1vw,10px);
    letter-spacing:.24em;
    color:var(--tinta-3);
  }

  /* ── tapa ── */
  .pag--tapa{
    justify-content:center;align-items:center;text-align:center;
    background:
      radial-gradient(130% 95% at 28% 8%, #6a2b4a 0%, var(--cuero-1) 34%, #2d1020 78%, #1b0813 100%);
    color:var(--oro);
    box-shadow:inset 0 0 70px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,220,180,.16);
  }
  .pag--tapa::before{
    content:"";position:absolute;inset:clamp(11px,3.6%,20px);
    border:1px solid rgba(224,184,120,.42);
    border-radius:3px;
  }
  .pag--tapa::after{
    content:"";position:absolute;inset:clamp(15px,5%,27px);
    border:1px solid rgba(224,184,120,.2);
    border-radius:2px;
  }
  .tapa__titulo{
    font-size:clamp(21px,4.6vmin,34px);
    font-weight:400;font-style:italic;
    line-height:1.28;
    color:var(--oro-2);
    text-shadow:0 2px 14px rgba(0,0,0,.55);
    padding:0 6%;
  }
  .tapa__sub{
    margin-top:clamp(10px,2.4vmin,18px);
    font-size:clamp(9px,1.5vmin,11.5px);
    letter-spacing:.3em;text-transform:lowercase;
    color:rgba(224,184,120,.72);
  }
  .tapa__pie{
    position:absolute;left:0;right:0;bottom:clamp(24px,7%,44px);
    font-size:clamp(8.5px,1.3vmin,10.5px);
    letter-spacing:.34em;text-transform:lowercase;
    color:rgba(224,184,120,.5);
    animation:respira 3.2s ease-in-out infinite;
  }
  @keyframes respira{0%,100%{opacity:.35}50%{opacity:.95}}

  /* ── adorno ── */
  .adorno{
    width:var(--t,64px);height:var(--t,64px);
    display:block;margin:0 auto;
    color:var(--tinta-2);
  }
  .filete{
    display:flex;align-items:center;gap:10px;
    margin:clamp(12px,3%,20px) auto;
    width:62%;
  }
  .filete i{
    flex:1;height:1px;
    background:linear-gradient(90deg,transparent,rgba(107,84,66,.42),transparent);
  }
  .filete b{
    width:5px;height:5px;transform:rotate(45deg);
    background:rgba(107,84,66,.5);
  }

  /* ── dedicatoria y cierre ── */
  .pag--nota{text-align:center}
  .nota__texto{
    font-size:clamp(13px,1.85vmin,16px);
    font-style:italic;line-height:1.85;
    color:var(--tinta-2);
  }
  .nota__firma{
    margin-top:clamp(14px,3.4%,24px);
    font-size:clamp(10px,1.4vmin,12px);
    letter-spacing:.22em;
    color:var(--tinta-3);
  }

  /* ── índice ── */
  .indice__tit{
    font-size:clamp(10px,1.4vmin,11.5px);
    letter-spacing:.34em;text-transform:uppercase;
    text-align:center;color:var(--tinta-2);
    margin-bottom:clamp(8px,2%,14px);
  }
  .indice__lista{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain}
  .indice__lista::-webkit-scrollbar{width:4px}
  .indice__lista::-webkit-scrollbar-thumb{background:rgba(107,84,66,.25);border-radius:2px}
  .indice__grupo{
    font-size:clamp(8.5px,1.15vmin,10px);
    letter-spacing:.26em;text-transform:uppercase;
    color:rgba(107,84,66,.62);
    margin:clamp(9px,2.4%,15px) 0 clamp(4px,1%,7px);
  }
  .indice__item{
    display:flex;align-items:baseline;gap:6px;
    width:100%;padding:clamp(3px,.9%,6px) 2px;
    border:0;background:none;
    font-family:var(--serif);
    font-size:clamp(11px,1.5vmin,13.5px);
    color:var(--tinta);text-align:left;
    cursor:pointer;border-radius:3px;
    transition:background .22s, color .22s;
  }
  .indice__item:hover{background:rgba(107,84,66,.09);color:#241610}
  .indice__item:focus-visible{outline:1.5px solid rgba(107,84,66,.6);outline-offset:1px}
  .indice__item i{
    flex:1;height:0;font-style:normal;
    border-bottom:1px dotted rgba(107,84,66,.38);
    transform:translateY(-3px);
  }
  .indice__item b{font-weight:400;color:var(--tinta-2);font-size:.85em}

  /* ── portadilla del poema ── */
  .pag--portada{text-align:center}
  .portada__marca{
    font-size:clamp(8px,1.1vmin,9.5px);
    letter-spacing:.3em;text-transform:uppercase;
    color:rgba(107,84,66,.55);
  }
  .portada__titulo{
    margin-top:clamp(8px,2%,14px);
    font-size:clamp(17px,2.9vmin,25px);
    font-weight:400;font-style:italic;
    line-height:1.3;color:#2e1f18;
  }
  .portada__para{
    margin-top:clamp(10px,2.4%,16px);
    font-size:clamp(11px,1.5vmin,13px);
    font-style:italic;line-height:1.7;
    color:var(--tinta-2);
    padding:0 4%;
  }

  /* ── versos ── */
  .pag--versos{}
  .verso{
    font-size:clamp(12.5px,1.72vmin,15.5px);
    line-height:1.92;
    color:var(--tinta);
    text-align:left;
  }
  .verso--hueco{height:.9em}
  .cara.viva .verso{animation:asoma .65s ease both;animation-delay:calc(var(--i) * .055s + .12s)}
  @keyframes asoma{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}

  .pag--vacia{background:none}

  /* ═════════════════════════════════════════════
     ZONAS DE CLIC
     ═════════════════════════════════════════════ */
  .zona{
    position:absolute;top:0;bottom:0;width:15%;
    z-index:60;border:0;background:none;cursor:pointer;
    opacity:0;transition:opacity .3s;
  }
  .zona::after{
    content:"";position:absolute;top:50%;left:50%;
    width:34px;height:34px;margin:-17px;
    border-radius:50%;
    background:rgba(247,235,222,.1);
    backdrop-filter:blur(3px);
  }
  .zona--ant{left:-16%}
  .zona--sig{right:-16%}
  .zona:hover{opacity:.55}
  .zona:focus-visible{opacity:.8;outline:none}
  .zona[disabled]{display:none}
  @media (max-width:760px){.zona{display:none}}

  /* ═════════════════════════════════════════════
     PANEL DE POEMAS
     ═════════════════════════════════════════════ */
  .panel{
    position:fixed;inset:0;z-index:70;
    display:grid;place-items:center;
    padding:clamp(14px,4vw,28px);
    opacity:0;visibility:hidden;
    transition:opacity .35s, visibility .35s;
  }
  .panel.visible{opacity:1;visibility:visible}
  .panel__fondo{
    position:absolute;inset:0;
    background:rgba(8,5,10,.8);
    backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px);
  }
  .panel__caja{
    position:relative;
    width:min(94vw,420px);max-height:84vh;
    display:flex;flex-direction:column;
    padding:clamp(20px,4.5vw,30px) clamp(14px,3.6vw,24px) clamp(12px,3vw,18px);
    border-radius:16px;
    border:1px solid rgba(224,184,120,.22);
    background:linear-gradient(168deg,#2c1a2d,#140b16);
    box-shadow:0 26px 64px rgba(0,0,0,.62);
    transform:translateY(16px);
    transition:transform .4s var(--ease);
  }
  .panel.visible .panel__caja{transform:none}
  .panel__x{
    position:absolute;top:6px;right:10px;
    width:34px;height:34px;border:0;border-radius:50%;
    background:transparent;color:rgba(247,235,222,.5);
    font-family:var(--serif);font-size:23px;line-height:1;cursor:pointer;
    transition:color .22s, background .22s;
  }
  .panel__x:hover{color:var(--oro-2);background:rgba(255,255,255,.07)}
  .panel__tit{
    text-align:center;flex:none;
    font-size:clamp(9.5px,1.4vw,11px);
    letter-spacing:.32em;text-transform:uppercase;
    color:rgba(224,184,120,.68);
    margin-bottom:clamp(10px,2.4vw,16px);
  }
  .panel__lista{flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:0 4px}
  .panel__lista::-webkit-scrollbar{width:5px}
  .panel__lista::-webkit-scrollbar-thumb{background:rgba(224,184,120,.2);border-radius:3px}
  .panel__grupo{
    font-size:clamp(8.5px,1.2vw,10px);
    letter-spacing:.26em;text-transform:uppercase;
    color:rgba(224,184,120,.5);
    margin:clamp(10px,2.4vw,16px) 0 6px;
  }
  .panel__grupo:first-child{margin-top:0}
  .panel__item{
    display:flex;align-items:baseline;gap:9px;
    width:100%;padding:9px 11px;margin-bottom:2px;
    border:0;border-radius:9px;background:transparent;
    font-family:var(--serif);
    color:var(--papel);text-align:left;
    cursor:pointer;
    transition:background .22s, transform .22s;
  }
  .panel__item:hover{background:rgba(224,184,120,.12)}
  .panel__item:active{transform:scale(.985)}
  .panel__item:focus-visible{outline:2px solid var(--oro);outline-offset:-2px}
  .panel__item.actual{background:rgba(224,184,120,.16)}
  .panel__item span{flex:1;min-width:0}
  .panel__item strong{
    display:block;font-weight:400;
    font-size:clamp(13px,1.9vw,15px);
  }
  .panel__item em{
    display:block;font-size:clamp(10px,1.4vw,11.5px);
    color:rgba(247,235,222,.45);margin-top:2px;
  }
  .panel__item b{
    font-weight:400;font-size:11px;
    color:rgba(224,184,120,.55);
    font-variant-numeric:tabular-nums;
  }

  /* ═════════════════════════════════════════════
     BARRA INFERIOR
     ═════════════════════════════════════════════ */
  .barra{
    flex:none;z-index:20;
    padding:0 16px clamp(14px,3.2vh,26px);
    display:flex;justify-content:center;align-items:center;
    gap:clamp(8px,2vw,14px);
  }
  .btn{
    font-family:var(--serif);
    font-size:clamp(10.5px,1.5vw,12.5px);
    letter-spacing:.22em;text-transform:lowercase;
    color:var(--papel-2);
    padding:.72em 1.5em;
    border-radius:999px;
    border:1px solid rgba(224,184,120,.26);
    background:rgba(38,18,32,.55);
    backdrop-filter:blur(9px);
    -webkit-backdrop-filter:blur(9px);
    cursor:pointer;
    transition:transform .28s, background .28s, border-color .28s, opacity .28s;
  }
  .btn:hover{background:rgba(110,44,72,.55);border-color:rgba(224,184,120,.5)}
  .btn:active{transform:scale(.95)}
  .btn:focus-visible{outline:2px solid var(--oro);outline-offset:3px}
  .btn[disabled]{opacity:.25;cursor:default;transform:none}
  .btn--redondo{width:38px;height:38px;padding:0;display:grid;place-items:center;font-size:17px}

  .marcador{
    font-size:clamp(9px,1.3vw,11px);
    letter-spacing:.2em;
    color:rgba(247,235,222,.4);
    min-width:78px;text-align:center;
  }

  /* ═════════════════════════════════════════════
     MÓVIL: menos trabajo por fotograma
     ═════════════════════════════════════════════ */
  @media (max-width:860px){
    /* backdrop-filter sobre una escena 3D obliga a releer el fondo
       en cada fotograma; en el móvil sale carísimo */
    .btn{
      backdrop-filter:none;-webkit-backdrop-filter:none;
      background:rgba(40,20,34,.88);
    }
    .panel__fondo{backdrop-filter:none;-webkit-backdrop-filter:none;background:rgba(8,5,10,.94)}
    /* el grano del papel y la sombra interior se pintan en toda la
       página: se notan poco y cuestan mucho */
    .cara{
      background:
        linear-gradient(90deg, rgba(150,120,80,.14) 0%, transparent 9%),
        radial-gradient(120% 90% at 78% 12%, #f7eeda 0%, var(--papel) 48%, var(--papel-2) 100%);
      box-shadow:none;
    }
    .canto{box-shadow:0 14px 30px rgba(0,0,0,.5)}
  }

  @media (prefers-reduced-motion:reduce){
    .mota{animation:none}
    .hoja,.libro{transition-duration:.12s}
    .velo{animation:none !important}
    .cara.viva .verso{animation:none}
  }
</style>
</head>
<body>

<div class="escena">
  <div class="libro" id="libro">
    <div class="canto canto--izq" aria-hidden="true"></div>
    <div class="canto canto--der" aria-hidden="true"></div>
    <!-- las hojas se generan aquí -->
    <button class="zona zona--ant" id="zonaAnt" type="button" aria-label="Página anterior"></button>
    <button class="zona zona--sig" id="zonaSig" type="button" aria-label="Página siguiente"></button>
  </div>
</div>

<div class="barra">
  <button class="btn btn--redondo" id="anterior" type="button" aria-label="Anterior">&lsaquo;</button>
  <span class="marcador" id="marcador"></span>
  <button class="btn btn--redondo" id="siguiente" type="button" aria-label="Siguiente">&rsaquo;</button>
  <button class="btn" id="btnTemas" type="button">poemas</button>
  <button class="btn" id="cerrar" type="button">cerrar</button>
</div>

<div class="panel" id="panel" role="dialog" aria-modal="true" aria-labelledby="panelTitulo">
  <div class="panel__fondo" data-cerrar-panel></div>
  <div class="panel__caja">
    <button class="panel__x" type="button" data-cerrar-panel aria-label="Cerrar">&times;</button>
    <p class="panel__tit" id="panelTitulo">¿cómo te sientes hoy?</p>
    <div class="panel__lista" id="panelLista"></div>
  </div>
</div>

<script>
/* ═══════════════════════════════════════════════════════════════
   1. PERSONALIZABLE — edita este bloque y nada más
   ═══════════════════════════════════════════════════════════════ */

const LIBRO = {
  titulo:   "Lo que no supe decirte de otra forma",
  subtitulo:"un librito de poemas",
  pie:      "ábreme",
  dedicatoria: "Este librito no tiene orden.\nBúscate en el índice según cómo amanezcas,\no ábrelo en cualquier página\ny quédate con la que te toque.",
  firmaDedicatoria: "para ti",
  cierre:   "Hice esto un poco por ti\ny un poco porque no sabía\nde qué otra forma decirlo.\n\nYa lo sabes.\nPero por si acaso: aquí estoy.",
  firmaCierre: "—"
};

/* Dos secciones. Agrega o quita poemas: el índice, la numeración
   y las páginas se recalculan solos.                              */
const SECCIONES = [
  {
    nombre: "según cómo amanezcas",
    poemas: [
      {
        titulo: "Cuando el día pesa",
        para: "para cuando todo sale al revés",
        versos: [
          "Hay días que vienen torcidos",
          "desde antes de abrir los ojos,",
          "y no hay mucho que hacer con ellos",
          "más que dejarlos pasar.",
          "",
          "No tienes que arreglarlo hoy.",

/* ═══════════════════════════════════════════════════════════════
   2. PIEZAS DE PÁGINA — de aquí para abajo no hace falta tocar
   ═══════════════════════════════════════════════════════════════ */

const azar = (a,b) => Math.random()*(b-a)+a;
const esc = t => String(t).replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));

/* flor de líneas, dibujada como adorno */
function adorno(tam){
  let p = "";
  for (let i=0;i<6;i++)
    p += `<ellipse cx="50" cy="31" rx="8.5" ry="17" transform="rotate(${i*60} 50 50)"/>`;
  return `<svg class="adorno" viewBox="0 0 100 100" style="--t:${tam}" aria-hidden="true">
    <g fill="none" stroke="currentColor" stroke-width="1.3" opacity=".5">${p}</g>
    <circle cx="50" cy="50" r="4.6" fill="none" stroke="currentColor" stroke-width="1.3" opacity=".72"/>
  </svg>`;
}
const filete = `<div class="filete" aria-hidden="true"><i></i><b></b><i></i></div>`;

const lineas = txt => txt.split("\n")
  .map((l,i) => l.trim()
    ? `<p class="verso" style="--i:${i}">${esc(l)}</p>`
    : `<p class="verso verso--hueco" style="--i:${i}"></p>`).join("");

const versos = arr => arr
  .map((l,i) => l.trim()
    ? `<p class="verso" style="--i:${i}">${esc(l)}</p>`
    : `<p class="verso verso--hueco" style="--i:${i}"></p>`).join("");

/* catálogo plano de poemas, para el índice y los saltos */
const POEMAS = [];
SECCIONES.forEach(s => s.poemas.forEach(p => POEMAS.push({ ...p, seccion:s.nombre })));

const PAGINAS = {
  tapa: () => `<div class="pag pag--tapa">
      <h1 class="tapa__titulo">${esc(LIBRO.titulo)}</h1>
      <p class="tapa__sub">${esc(LIBRO.subtitulo)}</p>
      <p class="tapa__pie">${esc(LIBRO.pie)}</p>
    </div>`,

  dedicatoria: () => `<div class="pag pag--nota"><div class="pag__cuerpo">
      ${adorno("clamp(46px,9vmin,72px)")}
      ${filete}
      <div class="nota__texto">${lineas(LIBRO.dedicatoria)}</div>
      <p class="nota__firma">${esc(LIBRO.firmaDedicatoria)}</p>
    </div></div>`,

  indice: () => {
    let n = 0, html = "";
    SECCIONES.forEach(s => {
      html += `<p class="indice__grupo">${esc(s.nombre)}</p>`;
      s.poemas.forEach(p => {
        html += `<button class="indice__item" type="button" data-poema="${n}">
                   <span>${esc(p.titulo)}</span><i></i><b>${n+1}</b>
                 </button>`;
        n++;
      });
    });
    return `<div class="pag">
        <p class="indice__tit">índice</p>
        ${filete}
        <div class="indice__lista">${html}</div>
      </div>`;
  },

  portada: k => `<div class="pag pag--portada"><div class="pag__cuerpo">
      ${adorno("clamp(38px,7vmin,58px)")}
      <p class="portada__marca">${esc(POEMAS[k].seccion)}</p>
      <h2 class="portada__titulo">${esc(POEMAS[k].titulo)}</h2>
      ${filete}
      <p class="portada__para">${esc(POEMAS[k].para)}</p>
    </div></div>`,

  versos: k => `<div class="pag pag--versos">
      <div class="pag__cuerpo">${versos(POEMAS[k].versos)}</div>
      <span class="folio">${k+1} de ${POEMAS.length}</span>
    </div>`,

  /* móvil: portadilla y versos en una sola página */
  completa: k => `<div class="pag pag--versos">
      <div class="pag__cuerpo">
        <p class="portada__marca" style="text-align:center">${esc(POEMAS[k].seccion)}</p>
        <h2 class="portada__titulo" style="text-align:center">${esc(POEMAS[k].titulo)}</h2>
        ${filete}
        ${versos(POEMAS[k].versos)}
      </div>
      <span class="folio">${k+1} de ${POEMAS.length}</span>
    </div>`,

  cierre: () => `<div class="pag pag--nota"><div class="pag__cuerpo">
      ${adorno("clamp(42px,8vmin,64px)")}
      ${filete}
      <div class="nota__texto">${lineas(LIBRO.cierre)}</div>
      <p class="nota__firma">${esc(LIBRO.firmaCierre)}</p>
    </div></div>`,

  vacia: () => `<div class="pag pag--vacia"></div>`
};

/* ═══════════════════════════════════════════════════════════════
   3. ARMAR EL LIBRO
   ═══════════════════════════════════════════════════════════════
   Una "vista" es lo que se ve de una vez. En pliego lleva página
   izquierda y derecha; en móvil solo derecha.

   La hoja i muestra por delante vistas[i].der, y por detrás
   vistas[i+1].izq — que es lo que queda a la izquierda al voltearla.
   ═══════════════════════════════════════════════════════════════ */

const libro  = document.getElementById("libro");
const escena = document.querySelector(".escena");

let vistas = [], hojas = [], pagina = 0, girando = false, unaPagina = false;

/* ¿cabe un pliego de dos páginas con holgura? */
function tocaUnaPagina(){
  return escena.clientWidth / 2 < 300 || matchMedia("(max-width:760px)").matches;
}

/* Mide el hueco real en píxeles en vez de fiarse de vh: en móvil
   `vh` incluye la barra de direcciones y el libro se desborda. */
function medir(){
  const dispH = escena.clientHeight * 0.96;
  const dispW = escena.clientWidth;
  const cols  = unaPagina ? 1 : 2;

  let ph = Math.min(dispH, 560);
  let pw = ph / 1.42;
  const pwMax = (dispW * (unaPagina ? 0.9 : 0.94)) / cols;
  if (pw > pwMax){ pw = pwMax; ph = pw * 1.42; }

  document.body.style.setProperty("--pw", Math.round(pw) + "px");
  document.body.style.setProperty("--ph", Math.round(ph) + "px");
}

/* aplica un cambio sin que se anime */
function sinTransicion(fn){
  hojas.forEach(h => h.style.transition = "none");
  fn();
  void libro.offsetHeight;
  hojas.forEach(h => h.style.transition = "");
}

function armarVistas(unaPagina){
  const v = [{ der:PAGINAS.tapa() }];

  if (unaPagina){
    v.push({ der:PAGINAS.dedicatoria() });
    v.push({ der:PAGINAS.indice() });
    POEMAS.forEach((_,k) => v.push({ der:PAGINAS.completa(k), poema:k }));
    v.push({ der:PAGINAS.cierre() });
  } else {
    v.push({ izq:PAGINAS.dedicatoria(), der:PAGINAS.indice() });
    POEMAS.forEach((_,k) => v.push({ izq:PAGINAS.portada(k), der:PAGINAS.versos(k), poema:k }));
    v.push({ izq:PAGINAS.cierre(), der:PAGINAS.vacia() });
  }
  return v;
}

function construir(){
  /* al cambiar de modo los dos libros tienen distinto número de
     vistas: nos quedamos con el poema, no con el número de página */
  const poemaAbierto = vistas[pagina] ? vistas[pagina].poema : undefined;

  unaPagina = tocaUnaPagina();
  document.body.classList.toggle("una-pagina", unaPagina);
  medir();
  vistas = armarVistas(unaPagina);

  if (poemaAbierto !== undefined){
    const i = vistas.findIndex(v => v.poema === poemaAbierto);
    if (i >= 0) pagina = i;
  }

  libro.querySelectorAll(".hoja").forEach(h => h.remove());
  hojas = [];

  const frag = document.createDocumentFragment();
  vistas.forEach((vista, i) => {
    const h = document.createElement("div");
    h.className = "hoja";
    const dorso = vistas[i+1] ? (vistas[i+1].izq || PAGINAS.vacia()) : PAGINAS.vacia();
    h.innerHTML =
      `<div class="cara cara--frente"><div class="velo"></div>${vista.der}</div>` +
      `<div class="cara cara--dorso"><div class="velo"></div>${dorso}</div>`;
    frag.appendChild(h);
    hojas.push(h);
  });
  libro.insertBefore(frag, document.getElementById("zonaAnt"));

  if (pagina > vistas.length - 1) pagina = vistas.length - 1;
  pintar(true);
}

/* Dentro de un contexto preserve-3d el navegador ordena por
   profundidad, no por z-index: cada hoja necesita su propio Z. */
/* saca del render las hojas que no se ven; deja un colchón para que
   la siguiente ya esté lista cuando se pase */
function acotar(desde, hasta){
  hojas.forEach((h,i) => h.classList.toggle("oculta", i < desde || i > hasta));
}

function pintar(sinAnimar){
  const N = vistas.length;
  acotar(pagina - 2, pagina + 2);
  hojas.forEach((h,i) => {
    const volteada = i < pagina;
    h.classList.toggle("volteada", volteada);
    h.style.setProperty("--z", ((volteada ? i + 1 : N - i) * 0.4).toFixed(2) + "px");
    /* en página única el dorso nunca se lee: una hoja ya pasada
       solo asomaría como una tira a la izquierda del libro */
    h.style.visibility = (unaPagina && volteada) ? "hidden" : "";
    if (sinAnimar){
      h.style.transition = "none";
      requestAnimationFrame(() => { h.style.transition = ""; });
    }
  });

  document.body.classList.toggle("abierto", pagina > 0);

  /* la vista actual se anima al llegar */
  libro.querySelectorAll(".cara.viva").forEach(c => c.classList.remove("viva"));
  const der = hojas[pagina] && hojas[pagina].querySelector(".cara--frente");
  const izq = pagina > 0 && hojas[pagina-1].querySelector(".cara--dorso");
  [der, izq].forEach(c => { if (c){ void c.offsetWidth; c.classList.add("viva"); } });

  const total = vistas.length - 1;
  $("marcador").textContent = pagina === 0 ? "portada" : pagina + " / " + total;
  $("anterior").disabled = pagina === 0;
  $("siguiente").disabled = pagina >= total;
  $("zonaAnt").disabled = pagina === 0;
  $("zonaSig").disabled = pagina >= total;
  $("cerrar").disabled = pagina === 0;
}

function $(id){ return document.getElementById(id); }

const espera = ms => new Promise(r => setTimeout(r, ms));
let cima = 0;   /* para que la última hoja movida quede siempre encima */

/* gira una sola hoja y espera `ms` antes de soltar el turno */
function girarUna(destino, ms){
  const mov = hojas[destino > pagina ? pagina : destino];
  mov.style.setProperty("--z", ((vistas.length + 2 + (++cima)) * 0.4).toFixed(2) + "px");
  mov.style.visibility = "";          /* al volver hay que verla girar */
  mov.classList.add("girando");

  pagina = destino;
  requestAnimationFrame(() => {
    hojas.forEach((h,i) => h.classList.toggle("volteada", i < pagina));
    document.body.classList.toggle("abierto", pagina > 0);
  });

  return espera(ms).then(() => mov.classList.remove("girando"));
}

/* encadenado = pasa las hojas una por una hasta llegar */
async function ir(destino, encadenado){
  destino = Math.max(0, Math.min(vistas.length - 1, destino));
  if (girando || destino === pagina) return;
  girando = true;

  const dir = destino > pagina ? 1 : -1;
  let salto = Math.abs(destino - pagina);

  if (encadenado && salto > 1){
    /* Sólo se animan las últimas hojas: pasar doce a la vez es
       mucha tela en un móvil y tampoco se alcanza a ver. */
    const tope = unaPagina ? 3 : 5;
    if (salto > tope){
      const arranque = destino - dir * tope;
      sinTransicion(() => {
        acotar(Math.min(pagina, arranque) - 1, Math.max(pagina, arranque) + 1);
        pagina = arranque;
        hojas.forEach((h,i) => h.classList.toggle("volteada", i < pagina));
      });
      salto = tope;
    }
    /* que las del tramo estén en el árbol antes de animarlas */
    acotar(Math.min(pagina, destino) - 1, Math.max(pagina, destino) + 1);
    void libro.offsetHeight;

    libro.classList.add("pasando");
    while (pagina !== destino) await girarUna(pagina + dir, 210);
    await espera(520);                /* que termine la última */
    libro.classList.remove("pasando");
  } else {
    acotar(Math.min(pagina, destino) - 1, Math.max(pagina, destino) + 1);
    void libro.offsetHeight;
    await girarUna(destino, 1080);
  }

  cima = 0;
  girando = false;
  pintar();
}

/* saltar a un poema, pasando las hojas por el camino */
function irAPoema(k){
  const i = vistas.findIndex(v => v.poema === k);
  if (i >= 0) ir(i, true);
}

/* ═══════════════════════════════════════════════════════════════
   4. CONTROLES
   ═══════════════════════════════════════════════════════════════ */

/* ── panel de poemas ── */
const panel = $("panel");

(function armarPanel(){
  let n = 0, html = "";
  SECCIONES.forEach(s => {
    html += `<p class="panel__grupo">${esc(s.nombre)}</p>`;
    s.poemas.forEach(p => {
      html += `<button class="panel__item" type="button" data-poema="${n}">
                 <span><strong>${esc(p.titulo)}</strong><em>${esc(p.para)}</em></span>
                 <b>${n+1}</b>
               </button>`;
      n++;
    });
  });
  $("panelLista").innerHTML = html;
})();

function abrirPanel(){
  const k = vistas[pagina] ? vistas[pagina].poema : undefined;
  panel.querySelectorAll(".panel__item").forEach(b =>
    b.classList.toggle("actual", +b.dataset.poema === k));
  panel.classList.add("visible");
  const act = panel.querySelector(".panel__item.actual") || panel.querySelector(".panel__item");
  if (act) act.scrollIntoView({ block:"nearest" });
}
const cerrarPanel = () => panel.classList.remove("visible");

$("btnTemas").addEventListener("click", abrirPanel);
panel.querySelectorAll("[data-cerrar-panel]").forEach(e => e.addEventListener("click", cerrarPanel));
panel.addEventListener("click", e => {
  const item = e.target.closest(".panel__item");
  if (!item) return;
  cerrarPanel();
  irAPoema(+item.dataset.poema);
});

$("siguiente").addEventListener("click", () => ir(pagina + 1));
$("anterior").addEventListener("click", () => ir(pagina - 1));
$("zonaSig").addEventListener("click", () => ir(pagina + 1));
$("zonaAnt").addEventListener("click", () => ir(pagina - 1));
$("cerrar").addEventListener("click", () => ir(0));

libro.addEventListener("click", e => {
  const item = e.target.closest(".indice__item");
  if (item){ irAPoema(+item.dataset.poema); return; }
  /* la tapa cerrada abre el libro */
  if (pagina === 0 && e.target.closest(".pag--tapa")) ir(1);
});

document.addEventListener("keydown", e => {
  if (panel.classList.contains("visible")){
    if (e.key === "Escape") cerrarPanel();
    return;
  }
  if (e.key === "ArrowRight" || e.key === " ") { e.preventDefault(); ir(pagina + 1); }
  if (e.key === "ArrowLeft")  ir(pagina - 1);
  if (e.key === "Escape")     ir(0, true);
  if (e.key === "p" || e.key === "P") abrirPanel();
});

/* deslizar en táctil */
(function(){
  let x0 = null, y0 = null;
  libro.addEventListener("touchstart", e => {
    x0 = e.touches[0].clientX; y0 = e.touches[0].clientY;
  }, { passive:true });
  libro.addEventListener("touchend", e => {
    if (x0 === null) return;
    const dx = e.changedTouches[0].clientX - x0;
    const dy = e.changedTouches[0].clientY - y0;
    if (Math.abs(dx) > 48 && Math.abs(dx) > Math.abs(dy) * 1.5) ir(pagina + (dx < 0 ? 1 : -1));
    x0 = null;
  }, { passive:true });
})();

/* remedir al cambiar el tamaño; rehacer sólo si cambia el modo */
let temporizador;
addEventListener("resize", () => {
  clearTimeout(temporizador);
  temporizador = setTimeout(() => {
    if (tocaUnaPagina() !== unaPagina) construir();
    else medir();
  }, 180);
});
addEventListener("orientationchange", () => setTimeout(construir, 260));

/* motas */
(function(){
  const frag = document.createDocumentFragment();
  for (let i=0, n=(innerWidth<760 ? 6 : 12); i<n; i++){
    const d = document.createElement("div");
    d.className = "mota";
    d.style.cssText =
      `--x:${azar(0,100).toFixed(1)}%;--p:${azar(2.5,6).toFixed(1)}px;` +
      `--dx:${azar(-8,8).toFixed(0)}vw;` +
      `--dur:${azar(18,34).toFixed(1)}s;--del:${azar(-32,0).toFixed(1)}s`;
    frag.appendChild(d);
  }
  document.body.appendChild(frag);
})();

construir();
</script>
</body>
</html>
