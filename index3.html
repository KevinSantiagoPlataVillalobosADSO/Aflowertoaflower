<!DOCTYPE html>
<html lang="es-CO">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Un tulipán para ti</title>
<style>
  /* ─────────────────────────────────────────────
     TOKENS
     ───────────────────────────────────────────── */
  :root{
    --noche-1:#0a0714;
    --noche-2:#120c22;
    --noche-3:#05030c;

    /* Tonalidad activa: la cambia el JS */
    --rosa:#ffd9e8;
    --rosa-glow:#ff8ec0;

    --trazo:1.7;
    --ui:#e8dcf0;
    --ui-suave:rgba(232,220,240,.45);

    --font-ui:"Segoe UI",system-ui,-apple-system,sans-serif;
    --font-msg:Georgia,"Times New Roman",serif;
  }

  *{box-sizing:border-box;margin:0;padding:0}

  html,body{height:100%}

  body{
    font-family:var(--font-ui);
    color:var(--ui);
    background:
      radial-gradient(120% 80% at 50% 0%,   #1b1032 0%, transparent 55%),
      radial-gradient(90%  70% at 50% 100%, rgba(255,142,192,.10) 0%, transparent 60%),
      linear-gradient(180deg, var(--noche-2) 0%, var(--noche-1) 45%, var(--noche-3) 100%);
    background-attachment:fixed;
    display:grid;
    place-items:center;
    overflow:hidden;
    position:relative;
  }

  /* ─────────────────────────────────────────────
     CIELO — estrellas y brillitos (generados en JS)
     ───────────────────────────────────────────── */
  #cielo{position:fixed;inset:0;pointer-events:none;z-index:0}

  .estrella{
    position:absolute;
    border-radius:50%;
    background:#fff;
    animation:titila var(--dur,3s) ease-in-out var(--del,0s) infinite;
  }
  @keyframes titila{
    0%,100%{opacity:.12; transform:scale(.7)}
    50%    {opacity:var(--max,.9); transform:scale(1)}
  }

  /* brillito de 4 puntas */
  .brillo{
    position:absolute;
    width:var(--s,16px);
    height:var(--s,16px);
    animation:destella var(--dur,5s) ease-in-out var(--del,0s) infinite;
  }
  .brillo::before,
  .brillo::after{
    content:"";
    position:absolute;
    inset:0;
    background:linear-gradient(90deg,transparent,#fff 48%,#fff 52%,transparent);
  }
  .brillo::before{clip-path:polygon(0 50%,50% 46%,100% 50%,50% 54%)}
  .brillo::after {clip-path:polygon(50% 0,54% 50%,50% 100%,46% 50%)}
  @keyframes destella{
    0%,100%{opacity:0;   transform:scale(.4) rotate(0deg)}
    45%    {opacity:.85; transform:scale(1)  rotate(15deg)}
    60%    {opacity:.35; transform:scale(.9) rotate(20deg)}
  }

  /* ─────────────────────────────────────────────
     ESCENA
     ───────────────────────────────────────────── */
  .escena{
    position:relative;
    z-index:1;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:clamp(10px,2.5vh,22px);
    padding:24px;
    text-align:center;
  }

  .kicker{
    font-size:11px;
    letter-spacing:.34em;
    text-transform:uppercase;
    color:var(--ui-suave);
    transition:color .8s ease;
  }

  /* ── Tulipán en trazo ───────────────────────── */
  .maceta{position:relative}

  #tulipan{
    width:clamp(150px,32vh,235px);
    height:auto;
    display:block;
    overflow:visible;
    filter:drop-shadow(0 0 0 transparent);
    transition:filter 1.4s ease;
  }
  #tulipan path{
    fill:none;
    stroke:var(--rosa);
    stroke-width:var(--trazo);
    stroke-linecap:round;
    stroke-linejoin:round;
    stroke-dasharray:1;
    stroke-dashoffset:1;
    transition:
      stroke-dashoffset var(--t,1s) cubic-bezier(.45,.05,.35,1) var(--d,0s),
      stroke 1.6s ease,
      opacity .6s ease;
  }
  /* tallo y hojas en un verde-rosado tenue para que el rosa sea de la flor */
  #tulipan .follaje{stroke:color-mix(in srgb, var(--rosa) 45%, #7fd7b0)}
  /* detalles interiores: trazo más fino y delicado */
  #tulipan .detalle{stroke-width:calc(var(--trazo) * .62); opacity:.75}

  /* estado florecido */
  .florecido #tulipan path{stroke-dashoffset:0}
  .florecido #tulipan{filter:drop-shadow(0 0 14px var(--rosa-glow)) drop-shadow(0 0 34px rgba(255,142,192,.35))}
  .florecido .kicker{color:var(--rosa)}

  /* halo detrás de la flor */
  .halo{
    position:absolute;
    left:50%; top:22%;
    width:190px; height:190px;
    margin:-95px 0 0 -95px;
    border-radius:50%;
    background:radial-gradient(circle, var(--rosa-glow) 0%, transparent 68%);
    opacity:0;
    transition:opacity 1.6s ease 1.2s, background 1.6s ease;
    pointer-events:none;
  }
  .florecido .halo{opacity:.20}

  /* suelo luminoso */
  .suelo{
    width:clamp(150px,32vh,235px);
    height:1px;
    margin-top:-6px;
    background:linear-gradient(90deg,transparent,var(--rosa-glow),transparent);
    opacity:0;
    transition:opacity 1.2s ease .3s, background 1.6s ease;
  }
  .florecido .suelo{opacity:.5}

  /* ── Mensaje ────────────────────────────────── */
  #mensaje{
    font-family:var(--font-msg);
    font-size:clamp(15px,2.1vh,20px);
    line-height:1.55;
    max-width:32ch;
    min-height:3.1em;
    color:#fff2f8;
    opacity:0;
    transform:translateY(10px);
    transition:opacity 1.1s ease, transform 1.1s ease;
    text-wrap:balance;
  }
  .florecido #mensaje{opacity:.95;transform:translateY(0);transition-delay:3.4s}

  #tono{
    display: none;
    font-size:10px;
    letter-spacing:.22em;
    text-transform:uppercase;
    color:var(--rosa);
    opacity:0;
    transition:opacity .9s ease 3.9s, color 1.6s ease;
  }
  .florecido #tono{opacity:.6}

  /* ── Botón ──────────────────────────────────── */
  #btnFlorecer{
    margin-top:6px;
    font:inherit;
    font-size:13px;
    letter-spacing:.16em;
    text-transform:uppercase;
    color:var(--rosa);
    background:transparent;
    border:1px solid color-mix(in srgb, var(--rosa) 55%, transparent);
    border-radius:999px;
    padding:11px 26px;
    cursor:pointer;
    position:relative;
    overflow:hidden;
    transition:color .5s ease, border-color .5s ease, box-shadow .5s ease, transform .18s ease, background-color .5s ease;
  }
  #btnFlorecer:hover:not(:disabled){
    background:color-mix(in srgb, var(--rosa) 12%, transparent);
    border-color:var(--rosa);
    box-shadow:0 0 22px -4px var(--rosa-glow);
  }
  #btnFlorecer:active:not(:disabled){transform:scale(.97)}
  #btnFlorecer:focus-visible{outline:2px solid var(--rosa);outline-offset:3px}
  #btnFlorecer:disabled{opacity:.4;cursor:default}

  /* ── Chispas del florecimiento ──────────────── */
  .chispa{
    position:absolute;
    left:50%; top:24%;
    width:5px; height:5px;
    border-radius:50%;
    background:#fff;
    box-shadow:0 0 8px 2px var(--rosa-glow);
    pointer-events:none;
    animation:chispea 1500ms ease-out forwards;
  }
  @keyframes chispea{
    0%  {opacity:0; transform:translate(-50%,-50%) scale(.2)}
    18% {opacity:1}
    100%{opacity:0; transform:translate(calc(-50% + var(--x)), calc(-50% + var(--y))) scale(.35)}
  }

  /* ── Accesibilidad: menos movimiento ────────── */
  @media (prefers-reduced-motion: reduce){
    .estrella,.brillo,.chispa{animation:none;opacity:.6}
    #tulipan path{transition-duration:.01s;transition-delay:0s}
    #mensaje,#tono{transition-delay:.1s}
  }

  @media (max-height:560px){
    .kicker{display:none}
    #mensaje{min-height:2.4em}
  }
</style>
</head>
<body>

<div id="cielo" aria-hidden="true"></div>

<main class="escena" id="escena">

  <p class="kicker">Un tulipán para ti</p>

  <div class="maceta">
    <div class="halo" aria-hidden="true"></div>

    <!-- Tulipán: line art. Cada trazo se dibuja con stroke-dashoffset.
         pathLength="1" normaliza la longitud para no tener que medirla en JS. -->
    <svg id="tulipan" viewBox="0 0 200 312" role="img"
         aria-label="Ilustración de un tulipán dibujado a línea">

      <!-- tallo -->
      <path class="follaje" pathLength="1" style="--d:0s;--t:1.05s"
            d="M100 180 C 103 214, 97 254, 100 306"/>

      <!-- hoja izquierda -->
      <path class="follaje" pathLength="1" style="--d:.55s;--t:1s"
            d="M98 258 C 76 250, 58 226, 50 194
               C 46 180, 56 177, 64 190
               C 78 210, 92 234, 98 258 Z"/>

      <!-- hoja derecha -->
      <path class="follaje" pathLength="1" style="--d:.8s;--t:1s"
            d="M102 240 C 124 233, 142 212, 150 182
               C 154 168, 144 165, 136 178
               C 122 198, 108 218, 102 240 Z"/>

      <!-- corola: copa redondeada, tres pétalos de punta suave -->
      <path pathLength="1" style="--d:1.35s;--t:1.7s"
            d="M100 182
               C 76 180, 62 160, 62 130
               C 62 106, 66 86,  76 74
               C 82 72,  89 80,  91 88
               C 92 78,  95 66, 100 58
               C 105 66, 108 78, 109 88
               C 111 80, 118 72, 124 74
               C 134 86, 138 106, 138 130
               C 138 160, 124 180, 100 182 Z"/>

      <!-- separación de pétalos -->
      <path class="detalle" pathLength="1" style="--d:2.75s;--t:.75s"
            d="M91 88 C 87 114, 87 150, 96 179"/>
      <path class="detalle" pathLength="1" style="--d:2.9s;--t:.75s"
            d="M109 88 C 113 114, 113 150, 104 179"/>

      <!-- nervadura central del pétalo frontal -->
      <path class="detalle" pathLength="1" style="--d:3.1s;--t:.65s"
            d="M100 74 C 98 100, 99 128, 100 150"/>

      <!-- curva baja de la copa: da volumen sin recargar -->
      <path class="detalle" pathLength="1" style="--d:3.25s;--t:.6s"
            d="M74 150 C 84 168, 116 168, 126 150"/>

    </svg>

    <div class="suelo" aria-hidden="true"></div>
  </div>

  <p id="mensaje" aria-live="polite"></p>
  <p id="tono" aria-hidden="true"></p>

  <button id="btnFlorecer" type="button">Florecer</button>

</main>

<script>
/* ═══════════════════════════════════════════════════════════════
   1. PERSONALIZABLE — edita este bloque y nada más
   ═══════════════════════════════════════════════════════════════ */

// Cada vez que el tulipán florece se muestra el siguiente mensaje.
const MENSAJES = [
  "Dicen que los tulipanes buscan la luz. Este simplemente encontró a quién acompañar.",

  "Hay flores bonitas, y luego están las que uno termina escogiendo sin saber muy bien por qué.",

  "El tulipán habla de cariño sincero. Me pareció una forma bonita de decir algo sin tener que decir demasiado.",

  "Hay días que necesitan flores. Este me pareció un buen día para una.",

  "Quizá las flores no necesitan una razón para alegrar el día. A veces basta con que lleguen en el momento justo.",

  "Que tengas días bonitos, de esos que llegan sin avisar y terminan dejando una sonrisa."
];

// Tonalidades de rosado por las que va pasando la flor.
const TONOS = [
  { nombre: "Rosa lienzo",   trazo: "#ffd9e8", brillo: "#ff8ec0" },
  { nombre: "Rosa cuarzo",   trazo: "#ffb3d4", brillo: "#ff6fae" },
  { nombre: "Rosa fucsia",   trazo: "#ff86b8", brillo: "#ff4d94" },
  { nombre: "Rosa carmín",   trazo: "#f45b96", brillo: "#ff2e7e" },
  { nombre: "Rosa magenta",  trazo: "#d63f80", brillo: "#ff4f9c" }
];

const CONFIG = {
  estrellas: 140,        // cantidad de puntos de luz
  brillitos: 7,          // destellos de 4 puntas
  msTono: 2600,          // cada cuánto cambia de tonalidad
  msFlorecer: 4300       // duración total de la floración
};

/* ═══════════════════════════════════════════════════════════════
   2. CIELO
   ═══════════════════════════════════════════════════════════════ */

const azar = (min, max) => Math.random() * (max - min) + min;

function pintarCielo(){
  const cielo = document.getElementById("cielo");
  const frag  = document.createDocumentFragment();

  for (let i = 0; i < CONFIG.estrellas; i++){
    const s = azar(0.8, 2.4);
    const e = document.createElement("div");
    e.className = "estrella";
    e.style.cssText =
      `left:${azar(0,100)}%;top:${azar(0,100)}%;` +
      `width:${s}px;height:${s}px;` +
      `--dur:${azar(2.2,6.5).toFixed(2)}s;` +
      `--del:${azar(0,6).toFixed(2)}s;` +
      `--max:${azar(0.45,1).toFixed(2)};` +
      `box-shadow:0 0 ${(s*2.5).toFixed(1)}px rgba(255,255,255,.75)`;
    frag.appendChild(e);
  }

  for (let i = 0; i < CONFIG.brillitos; i++){
    const b = document.createElement("div");
    b.className = "brillo";
    b.style.cssText =
      `left:${azar(6,94)}%;top:${azar(6,86)}%;` +
      `--s:${azar(12,26).toFixed(0)}px;` +
      `--dur:${azar(4,9).toFixed(2)}s;` +
      `--del:${azar(0,7).toFixed(2)}s`;
    frag.appendChild(b);
  }

  cielo.appendChild(frag);
}

/* ═══════════════════════════════════════════════════════════════
   3. FLORACIÓN
   ═══════════════════════════════════════════════════════════════ */

const escena  = document.getElementById("escena");
const boton   = document.getElementById("btnFlorecer");
const mensaje = document.getElementById("mensaje");
const etTono  = document.getElementById("tono");
const maceta  = document.querySelector(".maceta");

let iMensaje = -1;
let iTono    = -1;
let abierta  = false;
let cicloTono = null;

function aplicarTono(indice){
  iTono = (indice + TONOS.length) % TONOS.length;
  const t = TONOS[iTono];
  document.documentElement.style.setProperty("--rosa", t.trazo);
  document.documentElement.style.setProperty("--rosa-glow", t.brillo);
  etTono.textContent = t.nombre;
}

function siguienteTono(){ aplicarTono(iTono + 1); }

function chispas(cantidad = 16){
  for (let i = 0; i < cantidad; i++){
    const ang  = azar(0, Math.PI * 2);
    const dist = azar(55, 115);
    const c = document.createElement("div");
    c.className = "chispa";
    c.style.setProperty("--x", `${Math.cos(ang) * dist}px`);
    c.style.setProperty("--y", `${Math.sin(ang) * dist}px`);
    c.style.animationDelay = `${azar(0, 320).toFixed(0)}ms`;
    maceta.appendChild(c);
    c.addEventListener("animationend", () => c.remove());
  }
}

function florecer(){
  iMensaje = (iMensaje + 1) % MENSAJES.length;
  mensaje.textContent = MENSAJES[iMensaje];

  siguienteTono();
  escena.classList.add("florecido");
  abierta = true;

  boton.disabled = true;
  boton.textContent = "Floreciendo…";

  setTimeout(() => chispas(), 2800);

  setTimeout(() => {
    boton.disabled = false;
    boton.textContent = "Florecer de nuevo";
    // a partir de aquí la flor va cambiando de tonalidad sola
    clearInterval(cicloTono);
    cicloTono = setInterval(siguienteTono, CONFIG.msTono);
  }, CONFIG.msFlorecer);
}

function cerrar(){
  clearInterval(cicloTono);
  escena.classList.remove("florecido");
  abierta = false;
}

boton.addEventListener("click", () => {
  if (!abierta){
    florecer();
  } else {
    cerrar();
    boton.disabled = true;
    setTimeout(florecer, 900);   // se recoge y vuelve a abrir
  }
});

// Tocar la flor adelanta la tonalidad manualmente
document.getElementById("tulipan").addEventListener("click", () => {
  if (abierta) siguienteTono();
});

/* ═══════════════════════════════════════════════════════════════ */

pintarCielo();
aplicarTono(0);
</script>
</body>
</html>
