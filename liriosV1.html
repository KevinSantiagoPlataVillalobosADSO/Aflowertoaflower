<!DOCTYPE html>
<html lang="es-CO">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lirios para ti</title>
<style>
  /* ═════════════════════════════════════════════
     TOKENS
     ═════════════════════════════════════════════ */
  :root{
    --noche-1:#0a0714;
    --noche-2:#130d24;
    --noche-3:#05030c;

    /* Color secundario (centro de la flor). Lo cambia el JS */
    --rosa:#f4508e;        /* franja fuerte del centro   */
    --rosa-suave:#f98cb4;  /* transición hacia el blanco */
    --rosa-claro:#ffd8e6;  /* rosado tenue junto a la garganta */
    --puntos:#b31240;      /* motitas del interior */
    --glow:#ff6fae;

    /* Color primario (borde y punta del pétalo) */
    --blanco:#ffffff;
    --garganta:#eaf7c4;    /* verde-limón del corazón */

    --hoja-1:#1f5c3e;
    --hoja-2:#12402c;
    --tallo:#2c6b45;

    --ui:#ece2f2;
    --ui-suave:rgba(236,226,242,.45);
    --font-ui:"Segoe UI",system-ui,-apple-system,sans-serif;
    --font-msg:Georgia,"Times New Roman",serif;
  }

  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}

  body{
    font-family:var(--font-ui);
    color:var(--ui);
    background:
      radial-gradient(120% 80% at 50% 0%,   #1c1136 0%, transparent 55%),
      radial-gradient(90%  70% at 50% 100%, rgba(255,111,174,.10) 0%, transparent 60%),
      linear-gradient(180deg, var(--noche-2) 0%, var(--noche-1) 45%, var(--noche-3) 100%);
    background-attachment:fixed;
    display:grid;
    place-items:center;
    overflow:hidden;
    position:relative;
  }

  /* ═════════════════════════════════════════════
     CIELO
     ═════════════════════════════════════════════ */
  #cielo{position:fixed;inset:0;pointer-events:none;z-index:0}

  .estrella{
    position:absolute;border-radius:50%;background:#fff;
    animation:titila var(--dur,3s) ease-in-out var(--del,0s) infinite;
  }
  @keyframes titila{
    0%,100%{opacity:.12;transform:scale(.7)}
    50%    {opacity:var(--max,.9);transform:scale(1)}
  }

  .brillo{
    position:absolute;width:var(--s,16px);height:var(--s,16px);
    animation:destella var(--dur,5s) ease-in-out var(--del,0s) infinite;
  }
  .brillo::before,.brillo::after{
    content:"";position:absolute;inset:0;
    background:linear-gradient(90deg,transparent,#fff 48%,#fff 52%,transparent);
  }
  .brillo::before{clip-path:polygon(0 50%,50% 46%,100% 50%,50% 54%)}
  .brillo::after {clip-path:polygon(50% 0,54% 50%,50% 100%,46% 50%)}
  @keyframes destella{
    0%,100%{opacity:0;transform:scale(.4) rotate(0)}
    45%    {opacity:.8;transform:scale(1) rotate(15deg)}
    60%    {opacity:.3;transform:scale(.9) rotate(20deg)}
  }

  /* ═════════════════════════════════════════════
     ESCENA
     ═════════════════════════════════════════════ */
  .escena{
    position:relative;z-index:1;
    display:flex;flex-direction:column;align-items:center;
    gap:clamp(6px,1.6vh,16px);
    padding:16px;text-align:center;
  }

  .kicker{
    font-size:11px;letter-spacing:.34em;text-transform:uppercase;
    color:var(--ui-suave);transition:color .9s ease;
  }
  .abierto .kicker{color:var(--rosa-suave)}

  /* ── Jardín ─────────────────────────────────── */
  #jardin{
    position:relative;
    width:min(88vw, 46vh, 400px);
    aspect-ratio:1/1;
  }

  #follaje{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
  #follaje .brote{
    opacity:0;transform:translateY(6px);
    transition:opacity 1.4s ease .15s, transform 1.4s ease .15s;
  }
  .abierto #follaje .brote{opacity:1;transform:translateY(0)}

  .lirio{
    position:absolute;
    overflow:visible;
    filter:drop-shadow(0 6px 20px rgba(0,0,0,.55));
  }
  /* la del frente */
  .lirio--frente{left:15%;top:19%;width:70%;z-index:3}
  /* las de atrás, más chicas y desenfocadas para dar profundidad */
  .lirio--izq{left:-2%;top:1%;width:46%;z-index:2;
    transform:rotate(-14deg);filter:blur(.9px) drop-shadow(0 4px 14px rgba(0,0,0,.5));opacity:.9}
  .lirio--der{left:57%;top:47%;width:45%;z-index:2;
    transform:rotate(19deg);filter:blur(.9px) drop-shadow(0 4px 14px rgba(0,0,0,.5));opacity:.88}

  /* halo cálido detrás de la flor principal */
  .aura{
    position:absolute;left:50%;top:50%;
    width:78%;aspect-ratio:1;transform:translate(-50%,-50%);
    border-radius:50%;
    background:radial-gradient(circle, var(--glow) 0%, transparent 65%);
    opacity:0;transition:opacity 1.8s ease 1s, background 1.4s ease;
    pointer-events:none;z-index:1;
  }
  .abierto .aura{opacity:.22}

  /* ── Apertura de los pétalos ────────────────── */
  .petalo{
    transform-box:view-box;
    transform-origin:100px 100px;
    transform:scale(.14) rotate(-22deg);
    opacity:0;
    transition:
      transform 1.5s cubic-bezier(.18,.86,.24,1) calc(var(--i,0) * .11s + var(--base,0s)),
      opacity .7s ease calc(var(--i,0) * .11s + var(--base,0s));
  }
  .abierto .petalo{transform:scale(1) rotate(0);opacity:1}

  .corona{
    transform-box:view-box;transform-origin:100px 100px;
    transform:scale(.3);opacity:0;
    transition:transform 1.1s cubic-bezier(.2,.9,.3,1) calc(1.5s + var(--base,0s)),
               opacity .9s ease calc(1.5s + var(--base,0s));
  }
  .abierto .corona{transform:scale(1);opacity:1}

  /* los degradados cambian de tono suavemente */
  .lirio stop{transition:stop-color 1.5s ease}

  .contorno{fill:none;stroke:rgba(255,255,255,.6);stroke-width:.9}
  .nervio{fill:none;stroke:var(--rosa);stroke-width:1.1;opacity:.32;stroke-linecap:round;
          transition:stroke 1.5s ease}
  .mota{transition:fill 1.5s ease}

  /* ── Mensaje ────────────────────────────────── */
  #mensaje{
    font-family:var(--font-msg);
    font-size:clamp(15px,2.05vh,19px);
    line-height:1.55;max-width:30ch;min-height:3.1em;
    color:#fff4f8;
    opacity:0;transform:translateY(10px);
    transition:opacity 1.1s ease, transform 1.1s ease;
    text-wrap:balance;
  }
  .abierto #mensaje{opacity:.95;transform:translateY(0);transition-delay:2.6s}

  /* ── Botón ──────────────────────────────────── */
  #btnFlorecer{
    font:inherit;font-size:13px;letter-spacing:.16em;text-transform:uppercase;
    color:var(--rosa-suave);background:transparent;
    border:1px solid color-mix(in srgb, var(--rosa-suave) 55%, transparent);
    border-radius:999px;padding:11px 26px;cursor:pointer;
    transition:color .5s ease,border-color .5s ease,box-shadow .5s ease,
               transform .18s ease,background-color .5s ease;
  }
  #btnFlorecer:hover:not(:disabled){
    background:color-mix(in srgb, var(--rosa) 14%, transparent);
    border-color:var(--rosa-suave);
    box-shadow:0 0 22px -4px var(--glow);
  }
  #btnFlorecer:active:not(:disabled){transform:scale(.97)}
  #btnFlorecer:focus-visible{outline:2px solid var(--rosa-suave);outline-offset:3px}
  #btnFlorecer:disabled{opacity:.4;cursor:default}

  /* ── Chispas ────────────────────────────────── */
  .chispa{
    position:absolute;left:50%;top:50%;
    width:5px;height:5px;border-radius:50%;
    background:#fff;box-shadow:0 0 8px 2px var(--glow);
    pointer-events:none;z-index:4;
    animation:chispea 1500ms ease-out forwards;
  }
  @keyframes chispea{
    0%  {opacity:0;transform:translate(-50%,-50%) scale(.2)}
    18% {opacity:1}
    100%{opacity:0;transform:translate(calc(-50% + var(--x)),calc(-50% + var(--y))) scale(.35)}
  }

  /* ── Accesibilidad ──────────────────────────── */
  @media (prefers-reduced-motion: reduce){
    .estrella,.brillo,.chispa{animation:none;opacity:.6}
    .petalo,.corona,#follaje .brote{transition-duration:.01s;transition-delay:0s}
    #mensaje{transition-delay:.1s}
    .lirio--izq,.lirio--der{filter:none}
  }

  @media (max-height:600px){
    .kicker{display:none}
    #mensaje{min-height:2.4em}
    #jardin{width:min(80vw,40vh)}
  }
</style>
</head>
<body>

<div id="cielo" aria-hidden="true"></div>

<main class="escena" id="escena">

  <p class="kicker">Lirios para ti</p>

  <div id="jardin">
    <div class="aura" aria-hidden="true"></div>

    <!-- tallos, hojas y capullos -->
    <svg id="follaje" viewBox="0 0 200 200" aria-hidden="true">
      <defs>
        <linearGradient id="gHoja" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0"  stop-color="var(--hoja-1)"/>
          <stop offset="1"  stop-color="var(--hoja-2)"/>
        </linearGradient>
        <linearGradient id="gCapullo" x1="0" y1="1" x2="0" y2="0">
          <stop offset="0"   stop-color="#2c6b45"/>
          <stop offset=".55" stop-color="#b6d99a"/>
          <stop offset="1"   stop-color="var(--rosa-claro)"/>
        </linearGradient>
      </defs>

      <g class="brote" fill="none" stroke="var(--tallo)" stroke-width="2.6" stroke-linecap="round">
        <path d="M100 202 C 98 176, 100 148, 100 116"/>
        <path d="M100 158 C 86 140, 64 118, 48 66"/>
        <path d="M104 170 C 124 168, 146 158, 156 142"/>
        <path d="M100 186 C 116 184, 138 190, 150 200"/>
      </g>

      <g class="brote" fill="url(#gHoja)">
        <path d="M97 176 C 74 176, 50 164, 34 142 C 58 145, 82 156, 97 176 Z"/>
        <path d="M103 190 C 126 192, 150 186, 168 170 C 145 168, 118 174, 103 190 Z"/>
        <path d="M96 146 C 78 140, 62 122, 54 100 C 72 110, 88 126, 96 146 Z"/>
        <path d="M106 200 C 122 194, 134 180, 140 164 C 124 172, 111 184, 106 200 Z"/>
        <path d="M108 132 C 128 130, 146 118, 156 102 C 136 106, 118 116, 108 132 Z"/>
      </g>

      <!-- capullos sin abrir -->
      <g class="brote">
        <path d="M150 200 C 143 190, 143 176, 150 166 C 157 176, 157 190, 150 200 Z"
              fill="url(#gCapullo)" opacity=".95"/>
        <path d="M172 186 C 166 178, 166 166, 172 158 C 178 166, 178 178, 172 186 Z"
              fill="url(#gCapullo)" opacity=".8"/>
      </g>
    </svg>

    <!-- las flores se inyectan aquí -->
  </div>

  <p id="mensaje" aria-live="polite"></p>

  <button id="btnFlorecer" type="button">Florecer</button>

</main>

<script>
/* ═══════════════════════════════════════════════════════════════
   1. PERSONALIZABLE — edita este bloque y nada más
   ═══════════════════════════════════════════════════════════════ */

// Se elige uno al azar en cada floración (nunca repite el anterior).
const MENSAJES = [
  "El lirio significa admiración. Por algo terminé haciéndote estos.",
  "Hay días que se ponen mejores solo porque me escribiste.",
  "Gracias por ser de esas personas con las que hablar es fácil.",
  "Ojalá tu semana sea tan bonita como tú haces ver todo lo demás.",
  "Si el día viene pesado, acuérdate de que por acá alguien te echa porras.",
  "No hacía falta ocasión especial: hoy me acordé de ti y ya.",
  "Que alguien te cuide hoy como tú cuidas a todo el mundo.",
  "Me alegra un montón que existas. Así de simple.",
  "Estos lirios son chiquitos, pero el cariño con el que los hice no.",
  "Cuando algo bueno me pasa, tú eres de las primeras a quien quiero contarle."
];

// Tonos del color secundario (el centro de la flor). El borde siempre es blanco.
const TONOS = [
  { nombre:"Rosa estrella",  rosa:"#f4508e", suave:"#f98cb4", claro:"#ffd8e6", puntos:"#b31240", glow:"#ff6fae" },
  { nombre:"Rosa coral",     rosa:"#f76173", suave:"#fb96a2", claro:"#ffdedd", puntos:"#b0203a", glow:"#ff7d8e" },
  { nombre:"Fucsia",         rosa:"#e63aa0", suave:"#f47ec6", claro:"#ffd9ef", puntos:"#9c1470", glow:"#ff5ec0" },
  { nombre:"Frambuesa",      rosa:"#d92e6a", suave:"#ef7396", claro:"#ffd6e2", puntos:"#8f0f38", glow:"#ff4f86" }
];

const CONFIG = {
  estrellas:130,       // puntos de luz del cielo
  brillitos:6,         // destellos de 4 puntas
  msTono:3000,         // cada cuánto cambia de tono el centro
  msFlorecer:3600,     // duración de la floración
  motasPorPetalo:14    // motitas del interior del pétalo
};

/* ═══════════════════════════════════════════════════════════════
   2. CIELO
   ═══════════════════════════════════════════════════════════════ */

const azar = (a,b) => Math.random()*(b-a)+a;

function pintarCielo(){
  const cielo = document.getElementById("cielo");
  const frag  = document.createDocumentFragment();

  for (let i=0;i<CONFIG.estrellas;i++){
    const s = azar(0.8,2.4);
    const e = document.createElement("div");
    e.className = "estrella";
    e.style.cssText =
      `left:${azar(0,100)}%;top:${azar(0,100)}%;width:${s}px;height:${s}px;` +
      `--dur:${azar(2.2,6.5).toFixed(2)}s;--del:${azar(0,6).toFixed(2)}s;` +
      `--max:${azar(.45,1).toFixed(2)};` +
      `box-shadow:0 0 ${(s*2.5).toFixed(1)}px rgba(255,255,255,.75)`;
    frag.appendChild(e);
  }
  for (let i=0;i<CONFIG.brillitos;i++){
    const b = document.createElement("div");
    b.className = "brillo";
    b.style.cssText =
      `left:${azar(6,94)}%;top:${azar(6,86)}%;--s:${azar(12,26).toFixed(0)}px;` +
      `--dur:${azar(4,9).toFixed(2)}s;--del:${azar(0,7).toFixed(2)}s`;
    frag.appendChild(b);
  }
  cielo.appendChild(frag);
}

/* ═══════════════════════════════════════════════════════════════
   3. CONSTRUCCIÓN DEL LIRIO
   El pétalo se dibuja apuntando hacia arriba desde el centro (100,100)
   y luego se rota 6 veces: 3 tépalos externos + 3 pétalos internos.
   ═══════════════════════════════════════════════════════════════ */

function pathPetalo(largo, ancho){
  const w = ancho/2, y = t => (100 - largo*t).toFixed(1);
  const xi = k => (100 - w*k).toFixed(1);
  const xd = k => (100 + w*k).toFixed(1);
  return `M100 100
    C ${xi(.72)} ${y(.16)}, ${xi(1)} ${y(.44)}, ${xi(.84)} ${y(.72)}
    C ${xi(.62)} ${y(.90)}, ${xi(.24)} ${y(.98)}, 100 ${y(1)}
    C ${xd(.24)} ${y(.98)}, ${xd(.62)} ${y(.90)}, ${xd(.84)} ${y(.72)}
    C ${xd(1)} ${y(.44)}, ${xd(.72)} ${y(.16)}, 100 100 Z`;
}

// motitas repartidas por la mitad interior del pétalo
function motas(largo, ancho){
  let s = "";
  for (let i=0;i<CONFIG.motasPorPetalo;i++){
    const t  = azar(.10,.62);                       // 0 = centro, 1 = punta
    const hw = (ancho/2) * Math.sin(Math.PI*t) * .78;
    const x  = 100 + azar(-hw,hw);
    const yy = 100 - largo*t;
    const r  = azar(.9,2.1);
    s += `<ellipse class="mota" cx="${x.toFixed(1)}" cy="${yy.toFixed(1)}"
            rx="${r.toFixed(1)}" ry="${(r*.8).toFixed(1)}"
            fill="var(--puntos)" opacity="${azar(.35,.7).toFixed(2)}"/>`;
  }
  return s;
}

function estambres(){
  let s = "";
  const angs = [-58,-35,-12,12,35,58];
  angs.forEach((a,i) => {
    const L   = [40,46,43,43,46,40][i];
    const rad = a*Math.PI/180;
    const x   = 100 + L*Math.sin(rad);
    const yy  = 100 - L*Math.cos(rad);
    const cx  = 100 + L*.55*Math.sin(rad) + Math.sin(rad)*7;
    const cy  = 100 - L*.62*Math.cos(rad);
    s += `<path d="M100 100 Q ${cx.toFixed(1)} ${cy.toFixed(1)} ${x.toFixed(1)} ${yy.toFixed(1)}"
            fill="none" stroke="#e9f4cd" stroke-width="1.5" stroke-linecap="round" opacity=".92"/>`;
    s += `<ellipse cx="${x.toFixed(1)}" cy="${yy.toFixed(1)}" rx="6.6" ry="2.9"
            fill="#c22a1e" transform="rotate(${(a+62).toFixed(0)} ${x.toFixed(1)} ${yy.toFixed(1)})"/>`;
    s += `<ellipse cx="${(x-1).toFixed(1)}" cy="${(yy-1).toFixed(1)}" rx="3.4" ry="1.2"
            fill="#f26a4b" opacity=".7"
            transform="rotate(${(a+62).toFixed(0)} ${x.toFixed(1)} ${yy.toFixed(1)})"/>`;
  });
  // pistilo
  s += `<path d="M100 100 Q 96 74 94 54" fill="none" stroke="#dceeb2"
          stroke-width="2.1" stroke-linecap="round"/>`;
  s += `<ellipse cx="94" cy="52" rx="4.2" ry="3.2" fill="#cfe79a"/>`;
  return s;
}

let uid = 0;
function crearLirio(clase, giro){
  const id = "f" + (uid++);
  const externo = { largo:88, ancho:40 };
  const interno = { largo:84, ancho:49 };

  const grad = (sufijo, ancho) => `
    <linearGradient id="len${id}${sufijo}" gradientUnits="userSpaceOnUse"
                    x1="100" y1="100" x2="100" y2="${100-88}">
      <stop offset="0"    style="stop-color:var(--garganta)"/>
      <stop offset=".10"  style="stop-color:var(--rosa-claro)"/>
      <stop offset=".34"  style="stop-color:var(--rosa)"/>
      <stop offset=".62"  style="stop-color:var(--rosa-suave)"/>
      <stop offset=".88"  style="stop-color:var(--blanco)"/>
      <stop offset="1"    style="stop-color:var(--blanco)"/>
    </linearGradient>
    <linearGradient id="bor${id}${sufijo}" gradientUnits="userSpaceOnUse"
                    x1="${100-ancho/2}" y1="0" x2="${100+ancho/2}" y2="0">
      <stop offset="0"   style="stop-color:var(--blanco)" stop-opacity=".97"/>
      <stop offset=".30" style="stop-color:var(--blanco)" stop-opacity="0"/>
      <stop offset=".70" style="stop-color:var(--blanco)" stop-opacity="0"/>
      <stop offset="1"   style="stop-color:var(--blanco)" stop-opacity=".97"/>
    </linearGradient>`;

  const petalo = (cfg, sufijo, ang, i) => {
    const d = pathPetalo(cfg.largo, cfg.ancho);
    return `
      <g transform="rotate(${ang} 100 100)">
        <g class="petalo" style="--i:${i}">
          <path d="${d}" fill="url(#len${id}${sufijo})"/>
          <path d="${d}" fill="url(#bor${id}${sufijo})"/>
          <path class="nervio" d="M100 97 C 99 ${100-cfg.largo*.35}, 100 ${100-cfg.largo*.65}, 100 ${100-cfg.largo*.88}"/>
          ${motas(cfg.largo, cfg.ancho)}
          <path class="contorno" d="${d}"/>
        </g>
      </g>`;
  };

  let cuerpo = "";
  // tépalos externos (detrás)
  [0,120,240].forEach((a,i) => cuerpo += petalo(externo,"a", a+30+giro, i));
  // pétalos internos (delante)
  [60,180,300].forEach((a,i) => cuerpo += petalo(interno,"b", a+30+giro, i+3));

  return `
    <svg class="lirio ${clase}" viewBox="0 0 200 200" role="img"
         aria-label="Ilustración de un lirio blanco con el centro rosado">
      <defs>
        ${grad("a", externo.ancho)}
        ${grad("b", interno.ancho)}
        <radialGradient id="cen${id}">
          <stop offset="0"   style="stop-color:var(--garganta)" stop-opacity=".95"/>
          <stop offset=".55" style="stop-color:var(--garganta)" stop-opacity=".35"/>
          <stop offset="1"   style="stop-color:var(--garganta)" stop-opacity="0"/>
        </radialGradient>
      </defs>
      ${cuerpo}
      <circle class="corona" cx="100" cy="100" r="30" fill="url(#cen${id})"/>
      <g class="corona">${estambres()}</g>
    </svg>`;
}

/* ═══════════════════════════════════════════════════════════════
   4. FLORACIÓN
   ═══════════════════════════════════════════════════════════════ */

const escena  = document.getElementById("escena");
const jardin  = document.getElementById("jardin");
const boton   = document.getElementById("btnFlorecer");
const mensaje = document.getElementById("mensaje");

jardin.insertAdjacentHTML("beforeend",
  crearLirio("lirio--izq",   -8) +
  crearLirio("lirio--der",    16) +
  crearLirio("lirio--frente",  4));

// las de atrás abren un poquito después que la del frente
document.querySelector(".lirio--izq").style.setProperty("--base",".45s");
document.querySelector(".lirio--der").style.setProperty("--base",".75s");

let ultimo = -1, iTono = -1, abierta = false, cicloTono = null;

function aplicarTono(indice){
  iTono = (indice + TONOS.length) % TONOS.length;
  const t = TONOS[iTono], r = document.documentElement.style;
  r.setProperty("--rosa",       t.rosa);
  r.setProperty("--rosa-suave", t.suave);
  r.setProperty("--rosa-claro", t.claro);
  r.setProperty("--puntos",     t.puntos);
  r.setProperty("--glow",       t.glow);
}
const siguienteTono = () => aplicarTono(iTono + 1);

function mensajeAlAzar(){
  if (MENSAJES.length === 1) return MENSAJES[0];
  let i;
  do { i = Math.floor(Math.random()*MENSAJES.length); } while (i === ultimo);
  ultimo = i;
  return MENSAJES[i];
}

function chispas(cantidad = 18){
  for (let i=0;i<cantidad;i++){
    const ang = azar(0, Math.PI*2), dist = azar(60,130);
    const c = document.createElement("div");
    c.className = "chispa";
    c.style.setProperty("--x", `${Math.cos(ang)*dist}px`);
    c.style.setProperty("--y", `${Math.sin(ang)*dist}px`);
    c.style.animationDelay = `${azar(0,340).toFixed(0)}ms`;
    jardin.appendChild(c);
    c.addEventListener("animationend", () => c.remove());
  }
}

function florecer(){
  mensaje.textContent = mensajeAlAzar();
  siguienteTono();
  escena.classList.add("abierto");
  abierta = true;

  boton.disabled = true;
  boton.textContent = "Floreciendo…";

  setTimeout(() => chispas(), 2100);
  setTimeout(() => {
    boton.disabled = false;
    boton.textContent = "Otro lirio";
    clearInterval(cicloTono);
    cicloTono = setInterval(siguienteTono, CONFIG.msTono);
  }, CONFIG.msFlorecer);
}

function cerrar(){
  clearInterval(cicloTono);
  escena.classList.remove("abierto");
  abierta = false;
}

boton.addEventListener("click", () => {
  if (!abierta) { florecer(); }
  else {
    cerrar();
    boton.disabled = true;
    setTimeout(florecer, 900);
  }
});

// tocar una flor adelanta el tono
jardin.addEventListener("click", e => {
  if (abierta && e.target.closest(".lirio")) siguienteTono();
});

pintarCielo();
aplicarTono(0);
</script>
