<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Para ti</title>
<style>
/* ═══════════════════════════════════════════════════
   FLOR DELINEADA · HTML + CSS
   Zona de personalización rápida: bloque :root
   ═══════════════════════════════════════════════════ */

@property --hue { syntax:'<number>'; initial-value:318; inherits:true; }

:root{
  --hue: 318;              /* color inicial (0 rojo · 120 verde · 260 violeta · 318 rosa) */
  --ciclo: 24s;            /* velocidad del cambio de color */
  --respiro: 7s;           /* velocidad del latido de la flor */
  --vaiven: 6.5s;          /* velocidad del balanceo de pétalos */
  --tam-flor: min(74vw, 330px);   /* tamaño de la flor */
  --grosor: clamp(1.1px, 0.4vw, 1.9px); /* grosor del delineado */
  --fondo-a:#08040f;
  --fondo-b:#150a26;
  --fondo-c:#20103a;
  --tinta:#efe6ff;
}

*{ box-sizing:border-box; margin:0; padding:0; }

body{
  min-height:100vh;
  min-height:100svh;
  display:grid;
  place-items:center;
  padding: clamp(1.2rem,5vw,2.5rem) 1.1rem calc(clamp(1.2rem,5vw,2.5rem) + env(safe-area-inset-bottom));
  background: radial-gradient(130% 85% at 50% 4%, var(--fondo-c) 0%, var(--fondo-b) 42%, var(--fondo-a) 100%);
  color: var(--tinta);
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
  animation: ciclo-color var(--ciclo) linear infinite;
}

@keyframes ciclo-color{ from{ --hue:318 } to{ --hue:678 } }

/* ─── Atmósfera de fondo ─────────────────────────── */
.fondo{ position:fixed; inset:0; overflow:hidden; pointer-events:none; z-index:0; }

.aura{ position:absolute; border-radius:50%; will-change:transform; }
.aura--uno{
  width:90vmin; aspect-ratio:1; top:-18vmin; left:-14vmin;
  background: radial-gradient(circle, hsl(var(--hue) 90% 55% / .20), transparent 66%);
  animation: deriva-a 22s ease-in-out infinite;
}
.aura--dos{
  width:78vmin; aspect-ratio:1; bottom:-22vmin; right:-16vmin;
  background: radial-gradient(circle, hsl(calc(var(--hue) + 120) 90% 55% / .17), transparent 66%);
  animation: deriva-b 27s ease-in-out infinite;
}
@keyframes deriva-a{ 0%,100%{transform:translate3d(0,0,0) scale(1)} 50%{transform:translate3d(6vmin,4vmin,0) scale(1.12)} }
@keyframes deriva-b{ 0%,100%{transform:translate3d(0,0,0) scale(1.06)} 50%{transform:translate3d(-5vmin,-5vmin,0) scale(1)} }

/* polvo flotante */
.chispa{
  position:absolute; bottom:-6vh;
  width:3px; aspect-ratio:1; border-radius:50%;
  left: calc(var(--i) * 9.5% + 3%);
  background: hsl(calc(var(--hue) + var(--i) * 14) 100% 82%);
  box-shadow: 0 0 8px hsl(calc(var(--hue) + var(--i) * 14) 100% 70% / .9);
  opacity:0;
  animation: subir 15s linear infinite;
  animation-delay: calc(var(--i) * -1.6s);
}
@keyframes subir{
  0%{ transform:translate3d(0,0,0) scale(.6); opacity:0 }
  12%{ opacity:.85 }
  70%{ opacity:.5 }
  100%{ transform:translate3d(3vw,-108vh,0) scale(1); opacity:0 }
}

/* ─── Composición ────────────────────────────────── */
.escena{
  position:relative; z-index:1;
  display:flex; flex-direction:column; align-items:center;
  width:100%; max-width:480px;
}

.jardin{
  position:relative;
  display:flex; flex-direction:column; align-items:center;
}

/* ─── Flor ───────────────────────────────────────── */
.flor{
  position:relative;
  width: var(--tam-flor);
  aspect-ratio:1;
  display:grid; place-items:center;
  animation: respirar var(--respiro) ease-in-out infinite;
}
@keyframes respirar{ 0%,100%{transform:scale(1) rotate(0deg)} 50%{transform:scale(1.035) rotate(1.4deg)} }

.anillo{
  position:absolute; inset:2%;
  border-radius:50%;
  border: 1px dashed hsl(calc(var(--hue) + 60) 90% 75% / .28);
  animation: girar 46s linear infinite;
}
.anillo--interno{
  inset:16%;
  border-style:solid;
  border-color: hsl(var(--hue) 90% 78% / .14);
  animation-direction:reverse;
  animation-duration:34s;
}
@keyframes girar{ to{ transform:rotate(360deg) } }

.corola{ position:absolute; inset:0; --off:0deg; --dh:0; }
.corola--interior{ --off:22.5deg; --dh:46; }
.corola--halo{ --off:22.5deg; --dh:100; }

.petalo{
  position:absolute; left:50%; top:0;
  transform-origin:50% 100%;
  border: var(--grosor) solid hsl(calc(var(--hue) + var(--dh) + var(--i) * 7) 100% 76% / .92);
  border-radius: 50% 50% 46% 46% / 62% 62% 38% 38%;
  animation: vaiven var(--vaiven) ease-in-out infinite;
  animation-delay: calc(var(--i) * -.38s);
}
@keyframes vaiven{
  0%,100%{ transform: translateX(-50%) rotate(calc(var(--i) * 45deg + var(--off))) scaleY(1) }
  50%    { transform: translateX(-50%) rotate(calc(var(--i) * 45deg + var(--off) + 3.2deg)) scaleY(1.035) }
}

/* corona exterior */
.corola--exterior .petalo{
  width:27%; height:50%;
  background: linear-gradient(200deg,
    hsl(calc(var(--hue) + var(--i) * 7) 95% 68% / .26) 0%,
    hsl(calc(var(--hue) + 40) 95% 60% / .07) 55%,
    transparent 100%);
  box-shadow: 0 0 20px hsl(var(--hue) 100% 60% / .30),
              inset 0 0 24px hsl(calc(var(--hue) + 20) 100% 72% / .18);
}
/* nervadura central */
.corola--exterior .petalo::before{
  content:''; position:absolute; left:50%; bottom:9%;
  width:1px; height:58%;
  transform:translateX(-50%);
  background: linear-gradient(to top, hsl(calc(var(--hue) + 30) 100% 88% / .75), transparent);
}
/* contorno interior de detalle */
.corola--exterior .petalo::after{
  content:''; position:absolute; inset:14% 22% 8%;
  border: 1px solid hsl(calc(var(--hue) + 50) 100% 85% / .30);
  border-radius: inherit;
}

/* corona interior */
.corola--interior .petalo{
  width:19%; height:34%;
  background: linear-gradient(200deg,
    hsl(calc(var(--hue) + 46 + var(--i) * 7) 100% 74% / .34) 0%,
    transparent 85%);
  box-shadow: 0 0 14px hsl(calc(var(--hue) + 46) 100% 65% / .35);
  animation-duration: calc(var(--vaiven) * .82);
}
.corola--interior .petalo::before{
  content:''; position:absolute; left:50%; bottom:12%;
  width:1px; height:52%;
  transform:translateX(-50%);
  background: linear-gradient(to top, hsl(calc(var(--hue) + 70) 100% 90% / .7), transparent);
}

/* halo delineado (solo contorno) */
.corola--halo .petalo{
  width:31%; height:58%;
  border-width:1px;
  border-color: hsl(calc(var(--hue) + 100 + var(--i) * 7) 100% 82% / .30);
  border-radius: 50% 50% 44% 44% / 66% 66% 34% 34%;
  animation-duration: calc(var(--vaiven) * 1.45);
  animation-direction: alternate-reverse;
}

/* ─── Centro ─────────────────────────────────────── */
.centro{
  position:relative; z-index:3;
  width:23%; aspect-ratio:1;
  border-radius:50%;
  border: var(--grosor) solid hsl(calc(var(--hue) + 40) 100% 84% / .9);
  background:
    radial-gradient(circle at 36% 30%,
      hsl(calc(var(--hue) + 55) 100% 88% / .95) 0%,
      hsl(calc(var(--hue) + 25) 95% 62% / .45) 48%,
      hsl(var(--hue) 90% 40% / .12) 72%);
  box-shadow: 0 0 34px hsl(calc(var(--hue) + 30) 100% 62% / .55),
              inset 0 0 14px hsl(calc(var(--hue) + 60) 100% 90% / .5);
  animation: pulso-centro calc(var(--respiro) * .8) ease-in-out infinite;
}
@keyframes pulso-centro{ 0%,100%{ transform:scale(1) } 50%{ transform:scale(1.09) } }

.polen{
  position:absolute; top:50%; left:50%;
  width:13%; aspect-ratio:1; margin:-6.5% 0 0 -6.5%;
  border-radius:50%;
  background: hsl(calc(var(--hue) + 70) 100% 90%);
  box-shadow: 0 0 9px hsl(calc(var(--hue) + 60) 100% 78% / .95);
  transform: rotate(calc(var(--i) * 40deg)) translateY(-235%);
  animation: titilar 3.6s ease-in-out infinite;
  animation-delay: calc(var(--i) * -.42s);
}
@keyframes titilar{ 0%,100%{ opacity:.35 } 50%{ opacity:1 } }

/* ─── Tallo y hojas ──────────────────────────────── */
.tallo{
  position:relative;
  width: clamp(3px, .9vw, 5px);
  height: clamp(56px, 15vh, 104px);
  margin-top:-3%;
  border-radius:99px;
  background: linear-gradient(to bottom, hsl(150 55% 52% / .85), hsl(158 50% 34% / .08));
  box-shadow: 0 0 14px hsl(150 80% 50% / .22);
  transform-origin: 50% 100%;
  animation: mecer 8s ease-in-out infinite;
}
@keyframes mecer{ 0%,100%{ transform:rotate(-1.6deg) } 50%{ transform:rotate(1.6deg) } }

.hoja{
  position:absolute;
  width: clamp(34px, 11vw, 56px);
  aspect-ratio: 2 / 1;
  border: 1px solid hsl(150 65% 62% / .6);
  background: linear-gradient(120deg, hsl(150 60% 50% / .18), transparent 70%);
  transform-origin: 100% 50%;
  animation: hoja-flota 6s ease-in-out infinite;
}
.hoja::before{
  content:''; position:absolute; inset:0;
  background: linear-gradient(to right, transparent 8%, hsl(150 70% 78% / .45) 50%, transparent 92%);
  height:1px; top:50%;
}
.hoja--izq{ right:52%; top:26%; border-radius:100% 0 100% 0; transform:rotate(-16deg); }
.hoja--der{ left:52%; top:52%; border-radius:0 100% 0 100%; transform-origin:0 50%; transform:rotate(16deg); animation-delay:-2.4s; }
@keyframes hoja-flota{ 0%,100%{ filter:brightness(1) } 50%{ filter:brightness(1.35) } }

/* ─── Mensaje ────────────────────────────────────── */
.mensaje{
  margin-top: clamp(1.4rem, 5vh, 2.4rem);
  text-align:center;
}

.etiqueta{
  font-size:.66rem;
  letter-spacing:.42em;
  text-transform:uppercase;
  color: hsl(calc(var(--hue) + 50) 70% 84% / .6);
  padding-left:.42em;
}

.dedicatoria{
  margin:.75rem 0 .9rem;
  font-family: "Iowan Old Style", Georgia, "Times New Roman", serif;
  font-weight:400;
  font-size: clamp(1.55rem, 7.4vw, 2.5rem);
  line-height:1.24;
  letter-spacing:-.01em;
  background: linear-gradient(96deg,
    hsl(var(--hue) 100% 86%) 0%,
    hsl(calc(var(--hue) + 70) 100% 80%) 48%,
    hsl(calc(var(--hue) + 145) 95% 88%) 100%);
  -webkit-background-clip:text; background-clip:text;
  color:transparent;
  text-shadow: 0 0 34px hsl(var(--hue) 100% 60% / .22);
}
.dedicatoria em{ font-style:italic; }

.separador{
  display:flex; align-items:center; justify-content:center; gap:.6rem;
  margin:0 auto 1rem;
  width:min(72%, 220px);
}
.separador::before, .separador::after{
  content:''; height:1px; flex:1;
  background: linear-gradient(to right, transparent, hsl(calc(var(--hue) + 60) 90% 80% / .45), transparent);
}
.separador i{
  width:5px; aspect-ratio:1; border-radius:50%;
  background: hsl(calc(var(--hue) + 60) 100% 84%);
  box-shadow: 0 0 10px hsl(calc(var(--hue) + 60) 100% 70%);
}

.firma{
  font-size: clamp(.78rem, 3.4vw, .92rem);
  letter-spacing:.06em;
  color: hsl(calc(var(--hue) + 30) 40% 88% / .62);
}

/* ─── Pantallas muy bajas ────────────────────────── */
@media (max-height: 700px){
  :root{ --tam-flor: min(58vw, 250px); }
  .tallo{ height: clamp(40px, 9vh, 70px); }
}

/* ─── Accesibilidad: menos movimiento ────────────── */
@media (prefers-reduced-motion: reduce){
  *, *::before, *::after{
    animation-duration:.01ms !important;
    animation-iteration-count:1 !important;
    transition-duration:.01ms !important;
  }
  .chispa{ opacity:.4 }
}
</style>
</head>
<body>

  <!-- Atmósfera -->
  <div class="fondo" aria-hidden="true">
    <div class="aura aura--uno"></div>
    <div class="aura aura--dos"></div>
    <span class="chispa" style="--i:0"></span>
    <span class="chispa" style="--i:1"></span>
    <span class="chispa" style="--i:2"></span>
    <span class="chispa" style="--i:3"></span>
    <span class="chispa" style="--i:4"></span>
    <span class="chispa" style="--i:5"></span>
    <span class="chispa" style="--i:6"></span>
    <span class="chispa" style="--i:7"></span>
    <span class="chispa" style="--i:8"></span>
    <span class="chispa" style="--i:9"></span>
  </div>

  <main class="escena">

    <div class="jardin">
      <div class="flor" aria-hidden="true">
        <div class="anillo"></div>
        <div class="anillo anillo--interno"></div>

        <!-- halo de contornos -->
        <div class="corola corola--halo">
          <div class="petalo" style="--i:0"></div>
          <div class="petalo" style="--i:1"></div>
          <div class="petalo" style="--i:2"></div>
          <div class="petalo" style="--i:3"></div>
          <div class="petalo" style="--i:4"></div>
          <div class="petalo" style="--i:5"></div>
          <div class="petalo" style="--i:6"></div>
          <div class="petalo" style="--i:7"></div>
        </div>

        <!-- pétalos exteriores -->
        <div class="corola corola--exterior">
          <div class="petalo" style="--i:0"></div>
          <div class="petalo" style="--i:1"></div>
          <div class="petalo" style="--i:2"></div>
          <div class="petalo" style="--i:3"></div>
          <div class="petalo" style="--i:4"></div>
          <div class="petalo" style="--i:5"></div>
          <div class="petalo" style="--i:6"></div>
          <div class="petalo" style="--i:7"></div>
        </div>

        <!-- pétalos interiores -->
        <div class="corola corola--interior">
          <div class="petalo" style="--i:0"></div>
          <div class="petalo" style="--i:1"></div>
          <div class="petalo" style="--i:2"></div>
          <div class="petalo" style="--i:3"></div>
          <div class="petalo" style="--i:4"></div>
          <div class="petalo" style="--i:5"></div>
          <div class="petalo" style="--i:6"></div>
          <div class="petalo" style="--i:7"></div>
        </div>

        <!-- centro -->
        <div class="centro">
          <span class="polen" style="--i:0"></span>
          <span class="polen" style="--i:1"></span>
          <span class="polen" style="--i:2"></span>
          <span class="polen" style="--i:3"></span>
          <span class="polen" style="--i:4"></span>
          <span class="polen" style="--i:5"></span>
          <span class="polen" style="--i:6"></span>
          <span class="polen" style="--i:7"></span>
          <span class="polen" style="--i:8"></span>
        </div>
      </div>

      <div class="tallo" aria-hidden="true">
        <i class="hoja hoja--izq"></i>
        <i class="hoja hoja--der"></i>
      </div>
    </div>

    <div class="mensaje">
      <p class="etiqueta">Para ti</p>
      <h1 class="dedicatoria">Espero que todo te salga bien hoy</em></h1>
      <div class="separador"><i></i></div>
      <p class="firma">Ánimos Isa!</p>
    </div>
  </main>

</body>
</html>
