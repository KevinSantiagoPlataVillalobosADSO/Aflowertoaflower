<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Jardín · Colección</title>
<style>
/* ══════════════════════════════════════════════════════════
   TOKENS
   ══════════════════════════════════════════════════════════ */
:root{
  --bg:#080a0e;
  --bg-deep:#05060a;
  --panel:rgba(16,20,28,.88);
  --line:rgba(255,255,255,.075);
  --line-soft:rgba(255,255,255,.045);
  --txt:#eceaf0;
  --muted:#8b93a1;
  --rosa:#e8a0b8;
  --rosa-hot:#ff8fb1;
  --verde:#79d9b0;
  --drawer-w:300px;
  --topbar-h:60px;
  --ease:cubic-bezier(.22,.61,.36,1);
}

*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  background:var(--bg-deep);
  color:var(--txt);
  font-family:'Segoe UI',system-ui,-apple-system,"Helvetica Neue",sans-serif;
  overflow:hidden;
  -webkit-font-smoothing:antialiased;
}

/* Halo ambiental de fondo (se percibe entre transiciones) */
body::before{
  content:'';
  position:fixed; inset:0;
  background:
    radial-gradient(60% 55% at 12% 0%, rgba(232,160,184,.16), transparent 62%),
    radial-gradient(55% 50% at 92% 100%, rgba(121,217,176,.13), transparent 60%),
    var(--bg);
  z-index:0;
}

/* ══════════════════════════════════════════════════════════
   DRAWER (menú lateral)
   ══════════════════════════════════════════════════════════ */
.drawer{
  position:fixed; top:0; left:0; bottom:0;
  width:var(--drawer-w);
  max-width:86vw;
  z-index:40;
  display:flex; flex-direction:column;
  background:var(--panel);
  backdrop-filter:blur(22px) saturate(150%);
  -webkit-backdrop-filter:blur(22px) saturate(150%);
  border-right:1px solid var(--line);
  transform:translate3d(-101%,0,0);
  transition:transform .42s var(--ease);
  will-change:transform;
}
.drawer::after{
  content:'';
  position:absolute; top:0; right:-1px; bottom:0; width:1px;
  background:linear-gradient(180deg,transparent,rgba(232,160,184,.55) 25%,rgba(121,217,176,.4) 70%,transparent);
  opacity:.65;
}
body.menu-abierto .drawer{transform:translate3d(0,0,0)}

.drawer__head{
  padding:20px 20px 16px;
  border-bottom:1px solid var(--line-soft);
}
.brand{display:flex; align-items:center; gap:13px}
.brand__mark{
  width:34px; height:34px; flex:none;
  position:relative;
  border-radius:50%;
  background:radial-gradient(circle at 34% 30%, #fff9fb 0%, var(--rosa) 42%, #c46b8b 100%);
  box-shadow:0 0 0 1px rgba(255,255,255,.14), 0 6px 18px rgba(232,160,184,.32);
  animation:latir 5.5s var(--ease) infinite;
}
.brand__mark::before,.brand__mark::after{
  content:''; position:absolute; inset:0;
  border-radius:50%;
  border:1px solid rgba(232,160,184,.45);
  animation:aura 5.5s var(--ease) infinite;
}
.brand__mark::after{animation-delay:1.4s}
@keyframes latir{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
@keyframes aura{
  0%{transform:scale(1);opacity:.7}
  70%,100%{transform:scale(1.85);opacity:0}
}
.brand b{display:block; font-size:15px; letter-spacing:.5px; font-weight:600}
.brand small{display:block; font-size:10.5px; letter-spacing:2.4px; text-transform:uppercase; color:var(--muted); margin-top:2px}

.menu{
  flex:1; min-height:0;
  overflow-y:auto; overscroll-behavior:contain;
  padding:14px 12px 20px;
  scrollbar-width:thin; scrollbar-color:rgba(255,255,255,.14) transparent;
}
.menu::-webkit-scrollbar{width:6px}
.menu::-webkit-scrollbar-thumb{background:rgba(255,255,255,.13); border-radius:3px}

.menu__label{
  font-size:9.5px; letter-spacing:2.2px; text-transform:uppercase;
  color:var(--muted); padding:6px 12px 10px; opacity:.75; margin:0;
}

.item{
  position:relative;
  display:flex; align-items:center; gap:12px;
  width:100%;
  padding:11px 13px;
  margin-bottom:3px;
  border:0; border-radius:12px;
  background:transparent;
  color:var(--txt);
  font:inherit; font-size:13.5px; text-align:left;
  cursor:pointer;
  transition:background .25s var(--ease), transform .25s var(--ease);
}
.item::before{
  content:'';
  position:absolute; left:5px; top:50%;
  width:3px; height:0;
  border-radius:3px;
  background:linear-gradient(180deg,var(--rosa),var(--verde));
  transform:translateY(-50%);
  transition:height .32s var(--ease);
}
.item:hover{background:rgba(255,255,255,.045)}
.item:active{transform:scale(.985)}
.item:focus-visible{outline:2px solid var(--rosa); outline-offset:-2px}
.item.activa{background:linear-gradient(90deg,rgba(232,160,184,.15),rgba(232,160,184,.03) 70%)}
.item.activa::before{height:22px}

.item__dot{
  width:8px; height:8px; flex:none; border-radius:50%;
  background:rgba(255,255,255,.18);
  box-shadow:0 0 0 3px rgba(255,255,255,.03);
  transition:background .3s, box-shadow .3s;
}
.item.activa .item__dot{
  background:var(--rosa-hot);
  box-shadow:0 0 0 3px rgba(255,143,177,.16), 0 0 12px rgba(255,143,177,.7);
}
.item__txt{min-width:0; flex:1}
.item__nombre{display:block; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-weight:500}
.item__nota{
  display:block; font-size:10.5px; color:var(--muted); margin-top:2px;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.item__n{font-size:10px; color:var(--muted); font-variant-numeric:tabular-nums; opacity:.55}

.drawer__foot{
  padding:12px 20px 16px;
  border-top:1px solid var(--line-soft);
  font-size:10.5px; color:var(--muted); letter-spacing:.4px;
  display:flex; justify-content:space-between; align-items:center; gap:8px;
}
.drawer__foot kbd{
  font:inherit; font-size:9.5px;
  padding:2px 6px; border-radius:5px;
  border:1px solid var(--line);
  background:rgba(255,255,255,.04);
}

/* ══════════════════════════════════════════════════════════
   BACKDROP
   ══════════════════════════════════════════════════════════ */
.backdrop{
  position:fixed; inset:0; z-index:35;
  background:rgba(4,5,8,.6);
  backdrop-filter:blur(2px);
  opacity:0; visibility:hidden;
  transition:opacity .38s var(--ease), visibility .38s;
}
body.menu-abierto .backdrop{opacity:1; visibility:visible}

/* ══════════════════════════════════════════════════════════
   ESCENARIO
   ══════════════════════════════════════════════════════════ */
.stage{
  position:relative; z-index:10;
  height:100%;
  display:flex; flex-direction:column;
  transition:margin-left .42s var(--ease);
}

.topbar{
  height:var(--topbar-h); flex:none;
  display:flex; align-items:center; gap:14px;
  padding:0 14px 0 10px;
  background:rgba(10,12,17,.72);
  backdrop-filter:blur(16px) saturate(140%);
  -webkit-backdrop-filter:blur(16px) saturate(140%);
  border-bottom:1px solid var(--line);
}

/* Hamburguesa */
.burger{
  position:relative;
  width:42px; height:42px; flex:none;
  border:0; border-radius:12px;
  background:transparent; cursor:pointer;
  display:grid; place-items:center;
  transition:background .25s var(--ease);
}
.burger:hover{background:rgba(255,255,255,.06)}
.burger:focus-visible{outline:2px solid var(--rosa); outline-offset:2px}
.burger span{
  position:absolute; left:12px;
  width:18px; height:1.8px; border-radius:2px;
  background:var(--txt);
  transition:transform .38s var(--ease), opacity .2s var(--ease), width .38s var(--ease);
}
.burger span:nth-child(1){transform:translateY(-6px)}
.burger span:nth-child(3){transform:translateY(6px); width:12px}
.burger:hover span:nth-child(3){width:18px}
body.menu-abierto .burger span:nth-child(1){transform:rotate(45deg)}
body.menu-abierto .burger span:nth-child(2){opacity:0; transform:scaleX(.2)}
body.menu-abierto .burger span:nth-child(3){transform:rotate(-45deg); width:18px}

.crumb{flex:1; min-width:0}
.crumb__t{
  display:block; font-size:14px; font-weight:600; letter-spacing:.3px;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.crumb__s{
  display:block; font-size:10px; letter-spacing:1.6px; text-transform:uppercase;
  color:var(--muted); margin-top:1px;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}

.acciones{display:flex; align-items:center; gap:4px; flex:none}
.btn{
  width:36px; height:36px;
  display:grid; place-items:center;
  border:1px solid var(--line); border-radius:10px;
  background:rgba(255,255,255,.03);
  color:var(--txt); text-decoration:none;
  font-size:15px; line-height:1; cursor:pointer;
  transition:background .22s var(--ease), transform .22s var(--ease), border-color .22s;
}
.btn:hover{background:rgba(255,255,255,.09); border-color:rgba(255,255,255,.16)}
.btn:active{transform:scale(.92)}
.btn:disabled{opacity:.28; cursor:default; transform:none}
.btn:focus-visible{outline:2px solid var(--rosa); outline-offset:2px}

/* Visor */
.visor{position:relative; flex:1; min-height:0; background:var(--bg-deep)}
.visor iframe{
  position:absolute; inset:0;
  width:100%; height:100%;
  border:0; display:block;
  opacity:0;
  transition:opacity .5s var(--ease);
}
.visor.listo iframe{opacity:1}

/* Cargador */
.cargando{
  position:absolute; inset:0;
  display:grid; place-items:center;
  pointer-events:none;
  opacity:1; transition:opacity .4s var(--ease);
}
.visor.listo .cargando{opacity:0}
.petalo{
  width:46px; height:46px;
  position:relative;
  animation:girar 2.6s linear infinite;
}
.petalo i{
  position:absolute; inset:0;
  border-radius:50% 50% 50% 0;
  background:linear-gradient(135deg,rgba(232,160,184,.85),rgba(121,217,176,.25));
  transform-origin:50% 50%;
  animation:respirar 2.6s var(--ease) infinite;
}
.petalo i:nth-child(2){transform:rotate(120deg); animation-delay:-.28s}
.petalo i:nth-child(3){transform:rotate(240deg); animation-delay:-.56s}
@keyframes girar{to{transform:rotate(360deg)}}
@keyframes respirar{0%,100%{opacity:.35}50%{opacity:1}}

/* ══════════════════════════════════════════════════════════
   ESCRITORIO: el menú empuja, no tapa
   ══════════════════════════════════════════════════════════ */
@media (min-width:900px){
  body.menu-abierto .stage{margin-left:var(--drawer-w)}
  body.menu-abierto .backdrop{opacity:0; visibility:hidden}
}

/* ══════════════════════════════════════════════════════════
   MÓVIL
   ══════════════════════════════════════════════════════════ */
@media (max-width:520px){
  :root{--topbar-h:56px}
  .crumb__s{display:none}
  .item{padding:13px}
}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{
    animation-duration:.01ms !important;
    animation-iteration-count:1 !important;
    transition-duration:.01ms !important;
  }
}
</style>
</head>
<body>

<aside class="drawer" id="drawer" aria-label="Proyectos">
  <div class="drawer__head">
    <div class="brand">
      <span class="brand__mark" aria-hidden="true"></span>
      <div>
        <b id="marcaTitulo">Jardín</b>
        <small id="marcaSub">colección</small>
      </div>
    </div>
  </div>

  <nav class="menu" id="menu">
    <p class="menu__label">Proyectos</p>
    <!-- los botones se generan desde la lista PROYECTOS -->
  </nav>

  <div class="drawer__foot">
    <span id="conteo">—</span>
    <span><kbd>←</kbd> <kbd>→</kbd> navegar</span>
  </div>
</aside>

<div class="backdrop" id="backdrop"></div>

<main class="stage">
  <header class="topbar">
    <button class="burger" id="burger" aria-label="Abrir menú" aria-controls="drawer" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>

    <div class="crumb">
      <span class="crumb__t" id="tituloActual">—</span>
      <span class="crumb__s" id="archivoActual"></span>
    </div>

    <div class="acciones">
      <button class="btn" id="anterior" title="Anterior (←)" aria-label="Proyecto anterior">‹</button>
      <button class="btn" id="siguiente" title="Siguiente (→)" aria-label="Proyecto siguiente">›</button>
      <a class="btn" id="pestana" href="#" target="_blank" rel="noopener" title="Abrir en pestaña nueva" aria-label="Abrir en pestaña nueva">↗</a>
    </div>
  </header>

  <div class="visor" id="visor">
    <div class="cargando" aria-hidden="true">
      <div class="petalo"><i></i><i></i><i></i></div>
    </div>
    <iframe id="marco" title="Proyecto" allow="autoplay; fullscreen"></iframe>
  </div>
</main>

<script>
/* ═══════════════════════════════════════════════════════════════
   ÚNICA ZONA A EDITAR
   ───────────────────────────────────────────────────────────────
   Añade, quita o reordena proyectos en esta lista. Nada más.

     nombre  → texto que se ve en el menú
     archivo → ruta del .html (relativa a este archivo)
     nota    → subtítulo opcional (puede omitirse)
   ═══════════════════════════════════════════════════════════════ */
const MARCA = { titulo: 'Jardín', sub: 'colección' };

const PROYECTOS = [
  { nombre: 'Gerberas',         archivo: 'gerberas.html',         nota: 'La Cantidad Importa' },
  //{ nombre: 'Gerberas · G3',    archivo: 'indexG3.html',          nota: 'Variante' },
  { nombre: 'Lirios',           archivo: 'index4.html',           nota: 'Tus preferidos' },
  //{ nombre: 'Lirios para ti',   archivo: 'liriosV1.html',         nota: 'V1' },
  { nombre: 'Tulipanes', archivo: 'tulipan-nocturno.html', nota: 'Algo de Alegria' },
  { nombre: 'Campo de rosas',   archivo: 'rosas.html',            nota: 'Un campo sin final' },
  //{ nombre: 'Un tulipán',       archivo: 'index3.html',           nota: 'Boceto' },
  { nombre: 'Tu propia Flor',          archivo: 'index2.html',           nota: 'Algo unico para ti' },
];

/* ═══════════════════════════════════════════════════════════════
   De aquí hacia abajo no hace falta tocar nada
   ═══════════════════════════════════════════════════════════════ */
(function () {
  const $ = id => document.getElementById(id);
  const menu = $('menu'), marco = $('marco'), visor = $('visor'), burger = $('burger');
  const esEscritorio = () => window.matchMedia('(min-width:900px)').matches;

  let indice = -1;

  $('marcaTitulo').textContent = MARCA.titulo;
  $('marcaSub').textContent = MARCA.sub;
  $('conteo').textContent = PROYECTOS.length + ' piezas';

  /* --- Construcción del menú ---------------------------------- */
  const botones = PROYECTOS.map(function (p, i) {
    const b = document.createElement('button');
    b.className = 'item';
    b.type = 'button';
    b.innerHTML =
      '<span class="item__dot"></span>' +
      '<span class="item__txt">' +
        '<span class="item__nombre"></span>' +
        (p.nota ? '<span class="item__nota"></span>' : '') +
      '</span>' +
      '<span class="item__n">' + String(i + 1).padStart(2, '0') + '</span>';
    b.querySelector('.item__nombre').textContent = p.nombre;
    if (p.nota) b.querySelector('.item__nota').textContent = p.nota;
    b.addEventListener('click', function () {
      abrir(i);
      if (!esEscritorio()) cerrarMenu();
    });
    menu.appendChild(b);
    return b;
  });

  /* --- Navegación --------------------------------------------- */
  function abrir(i, desdeHash) {
    if (i < 0 || i >= PROYECTOS.length || i === indice) return;
    indice = i;
    const p = PROYECTOS[i];

    visor.classList.remove('listo');
    marco.src = p.archivo;

    botones.forEach(function (b, k) { b.classList.toggle('activa', k === i); });
    $('tituloActual').textContent = p.nombre;
    $('archivoActual').textContent = p.archivo;
    $('pestana').href = p.archivo;
    $('anterior').disabled = i === 0;
    $('siguiente').disabled = i === PROYECTOS.length - 1;
    document.title = p.nombre + ' · ' + MARCA.titulo;

    if (!desdeHash) history.replaceState(null, '', '#' + encodeURIComponent(p.archivo));
    botones[i].scrollIntoView({ block: 'nearest' });
  }

  marco.addEventListener('load', function () { visor.classList.add('listo'); });
  $('anterior').addEventListener('click', function () { abrir(indice - 1); });
  $('siguiente').addEventListener('click', function () { abrir(indice + 1); });

  /* --- Menú ---------------------------------------------------- */
  function abrirMenu() {
    document.body.classList.add('menu-abierto');
    burger.setAttribute('aria-expanded', 'true');
    burger.setAttribute('aria-label', 'Cerrar menú');
  }
  function cerrarMenu() {
    document.body.classList.remove('menu-abierto');
    burger.setAttribute('aria-expanded', 'false');
    burger.setAttribute('aria-label', 'Abrir menú');
  }
  burger.addEventListener('click', function () {
    document.body.classList.contains('menu-abierto') ? cerrarMenu() : abrirMenu();
  });
  $('backdrop').addEventListener('click', cerrarMenu);

  /* --- Teclado ------------------------------------------------- */
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') cerrarMenu();
    else if (e.key === 'ArrowLeft') abrir(indice - 1);
    else if (e.key === 'ArrowRight') abrir(indice + 1);
    else if (e.key === 'm' || e.key === 'M') burger.click();
  });

  /* --- Arranque ------------------------------------------------ */
  const hash = decodeURIComponent(location.hash.slice(1));
  const inicial = PROYECTOS.findIndex(function (p) { return p.archivo === hash; });
  abrir(inicial >= 0 ? inicial : 0, true);
  if (esEscritorio()) abrirMenu();
})();
</script>
</body>
</html>
